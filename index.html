<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港式麻雀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: flat dark panels. Opponents stack on top, your own river below, hand + actions docked at the bottom. Cyan marks whose turn it is, coral marks a win, call or last discard. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9; --line:#dde2ea; --line-2:#c5ccd8;
  --ink:#151a23; --muted:#5d6678; --accent:#0a7f9c; --accent-ink:#ffffff; --hot:#d9432d;
  --tile-top:#fffdf7; --tile-bot:#f0ecdf; --tile-side:#98a1b3;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --rw:clamp(17px,4.6vw,24px); --mw:clamp(18px,4.8vw,26px);
  --hw:clamp(21px,calc((100vw - 40px) / 15.4),46px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(900px 420px at 50% -10%,#ffffff 0,rgba(236,239,243,0) 70%);color:var(--ink);font:14px/1.5 var(--sans);margin:0;
  padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
button{font:inherit;color:inherit}
.app{max-width:1040px;margin:0 auto;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{margin:0 8px 0 0;font:900 20px/1 var(--sans);letter-spacing:.22em}
.top .sp{flex:1}
.btn{font:500 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 16px;height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.t:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.win{background:var(--hot);border-color:var(--hot);color:#fff;font:900 18px var(--sans);padding:0 22px}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;height:44px;min-width:64px;padding:0 14px;cursor:pointer;font:500 15px var(--sans)}
.chip.on{border-color:var(--accent);background:rgba(10,127,156,.1);color:var(--accent);font-weight:700}

/* tiles */
.t{width:var(--tw,30px);height:calc(var(--tw,30px)*1.36);display:inline-block;flex:none;position:relative;padding:calc(var(--tw,30px)*.05);margin:0;border:0;
  border-radius:calc(var(--tw,30px)*.12);background:linear-gradient(180deg,var(--tile-top),var(--tile-bot));
  box-shadow:inset 0 0 0 1px rgba(60,50,30,.1),0 calc(var(--tw,30px)*.07) 0 var(--tile-side),0 calc(var(--tw,30px)*.12) calc(var(--tw,30px)*.1) rgba(30,40,60,.28)}
.t svg{display:block;width:100%;height:100%}
.t text{font-family:var(--sans);font-weight:900}
.t.back{background:repeating-linear-gradient(135deg,#3f6f7e 0 2px,#376371 2px 5px);box-shadow:inset 0 0 0 1px #2c525f,0 calc(var(--tw,30px)*.07) 0 #1f3f4a,0 calc(var(--tw,30px)*.12) calc(var(--tw,30px)*.1) rgba(30,40,60,.3)}
.t.last{outline:2px solid var(--hot);outline-offset:1px}
.t.win{outline:2px solid var(--accent);outline-offset:2px}

/* seats */
.opps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:grid;gap:8px;min-width:0;position:relative}
.seat.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,127,156,.16)}
.sh{display:flex;align-items:center;gap:8px;min-width:0}
.wchip{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;font:700 14px/1 var(--sans);color:var(--accent);background:var(--surface-2)}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel{color:var(--muted);font-size:12px;white-space:nowrap}
.dl{font:700 11px/1 var(--sans);background:var(--hot);color:#fff;padding:3px 6px;border-radius:5px;white-space:nowrap;letter-spacing:.05em}
.sc{margin-left:auto;font:700 14px var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-end;min-width:0;min-height:calc(var(--mw)*1.36 + 6px)}
.backs{display:flex;gap:1px;--tw:13px;flex-wrap:wrap}
.meld,.fl,.reveal{display:inline-flex;gap:1px;--tw:var(--mw)}
.fl{--tw:calc(var(--rw)*.95)}
/* rack: hidden tiles, a divider, then open melds and flowers on one continuous strip */
.rack{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 0;min-width:0;padding:6px 8px 7px;border-radius:8px;background:linear-gradient(180deg,#2f3540,#262b34);border:1px solid #1c2027;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.rack .backs{--tw:15px;flex-wrap:nowrap;gap:6px}
.rack .grp{display:inline-flex;gap:1px}
.rack .t.back{background:repeating-linear-gradient(135deg,#9ed3dc 0 2px,#7fbfcb 2px 5px);box-shadow:inset 0 0 0 1px #5a9aa6,0 calc(var(--tw)*.07) 0 #3d7480,0 calc(var(--tw)*.12) calc(var(--tw)*.1) rgba(0,0,0,.3)}
.numbadge{margin-left:auto;font:900 12px/1 var(--sans);background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;white-space:nowrap}
.numbadge b{font:900 17px/1 var(--sans);color:var(--accent);margin-right:2px}
.numbadge+.sc{margin-left:8px}
.rack .backs+.sep,.rack .reveal+.sep,.rack .backs+.fl,.rack .reveal+.fl{margin-left:auto}
.rack .sep{flex:none;width:2px;align-self:stretch;margin:0 9px;background:rgba(255,255,255,.3);border-radius:1px}
.rack .meld{--tw:var(--mw)}
.rack .fl{--tw:var(--mw);gap:1px;margin-left:10px;align-self:flex-end}
.rack .reveal{--tw:var(--mw)}
.rack.me{padding:0 10px 8px;gap:4px 0;flex-wrap:wrap}
.rack.me .hand{padding-top:16px;flex:0 1 auto;min-height:0}
.rack.me .rm{display:flex;align-items:flex-end;min-width:0;padding-bottom:1px;margin-left:auto}
.rack.me .rm:empty{display:none}
.rack.me .meld,.rack.me .fl{--tw:calc(var(--hw)*.8)}
.reveal{flex-wrap:wrap}
.river{display:flex;flex-wrap:wrap;gap:4px 2px;--tw:var(--rw);min-height:calc(var(--rw)*1.36 + 6px);align-content:flex-start;padding-top:8px;border-top:1px solid var(--line)}
.call{position:absolute;right:12px;top:-15px;background:var(--hot);color:#fff;font:900 22px/1 var(--sans);padding:8px 14px;border-radius:8px;animation:pop 1.1s ease-out forwards;z-index:2;box-shadow:0 4px 14px rgba(30,40,60,.3)}
@keyframes pop{0%{transform:scale(.4);opacity:0}18%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}

.mid{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding:8px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);min-height:58px}
.mid .msg{color:var(--ink);font-weight:700;flex:1;min-width:150px}
.mid .lastd{display:inline-flex;align-items:center;gap:8px;--tw:28px}
.mid b{color:var(--ink);font:700 14px var(--mono);font-variant-numeric:tabular-nums}


/* new-game screen: two steps (settings, then how to play) */
.sheet.setup{gap:12px}
.shead{display:flex;align-items:center;gap:12px}
.shead .t{--tw:38px}
.shead h2{letter-spacing:.2em}
.shead p{font-size:13px}
.step{display:grid;gap:8px}
.step>h4{margin:0;display:flex;gap:8px;align-items:center;font:900 14px var(--sans)}
.step>h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:12px}
.step .card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:12px}
.step .lab{display:block;font:700 12px/1 var(--sans);letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.step .opts .chip{flex:1 1 0;white-space:nowrap;padding:0 6px}
.step .chip small{font-size:11px;font-weight:400;opacity:.75;margin-left:3px}
.step .btn.block{width:100%;min-height:48px;justify-content:center;font-weight:700}
.step .hr{height:1px;background:var(--line);border:0;margin:0}
.step .note{margin:6px 0 0}
.link{color:var(--accent);font:500 13px var(--sans);text-decoration:underline;background:none;border:0;padding:4px 0;cursor:pointer}
/* central discard pool */
.pond{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:grid;gap:8px;min-width:0}
.pond .plg{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px;color:var(--muted)}
.pond .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pond .lg i{width:14px;height:4px;border-radius:2px;background:var(--c)}
.pond .pc{margin-left:auto;font:600 12px var(--mono)}
.pool{display:flex;flex-wrap:wrap;gap:6px 3px;--tw:calc(var(--rw)*1.12);min-height:calc(var(--rw)*1.12*1.36 + 10px);align-content:flex-start;padding-bottom:6px}
.pool .t{margin-bottom:5px}
.pool .t::after{content:'';position:absolute;left:10%;right:10%;bottom:-6px;height:3px;border-radius:2px;background:var(--c)}
.s0{--c:#0a7f9c}.s1{--c:#d9822b}.s2{--c:#7a56c9}.s3{--c:#3f9a5c}
.verlink{margin-left:10px;font-size:12px;color:var(--muted);text-decoration:underline;white-space:nowrap}
/* dock */
.dock{position:sticky;bottom:0;z-index:3;padding:14px 0 10px;background:linear-gradient(180deg,rgba(236,239,243,0),var(--bg) 22px)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:44px;margin-bottom:6px}
.mep{display:inline-flex;align-items:center;gap:6px;margin-right:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;white-space:nowrap}
.mep.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,127,156,.16)}
.mep .sc{margin-left:4px}
.note{color:var(--muted);font-size:13px}
.bt{display:inline-flex;gap:1px;--tw:18px}
.claimtile{display:inline-flex;--tw:30px;margin-right:4px}
.alert{flex:1 1 100%;display:flex;align-items:center;gap:10px;background:var(--hot);color:#fff;border-radius:10px;padding:8px 12px;font-weight:900;font-size:15px;line-height:1.3;box-shadow:0 4px 14px rgba(217,67,45,.35);animation:alertpulse 1.2s ease-in-out infinite}
.alert .claimtile{--tw:28px;margin:0}.alert small{display:block;font-weight:500;font-size:12px;opacity:.92}
.claimrow{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.claimrow .sp{flex:1}
.btn.big{font:900 17px var(--sans);height:44px;padding:0 20px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn.big.o{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.passb{color:var(--muted);height:36px;padding:0 14px}
@keyframes alertpulse{50%{box-shadow:0 0 0 6px rgba(217,67,45,.18),0 4px 14px rgba(217,67,45,.35)}}
.hand{display:flex;align-items:flex-end;gap:2px;--tw:var(--hw);padding-top:14px;min-height:calc(var(--hw)*1.36 + 20px)}
.hand .t{cursor:pointer;transition:transform .1s}
.hand .t:hover{transform:translateY(-5px)}
.hand .t.sel{transform:translateY(-14px);outline:2px solid var(--accent);outline-offset:1px}
.hand.off .t{cursor:default}
.hand.off .t:hover{transform:none}
.hand .gap{width:calc(var(--hw)*.35);flex:none}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(22,26,34,.55);display:grid;place-items:center;z-index:20;overflow:auto;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:20px;display:grid;gap:14px}
.sheet h2{margin:0;font:900 24px/1.2 var(--sans);letter-spacing:.08em}
.sheet h3{margin:0;font:700 13px var(--sans);color:var(--accent);letter-spacing:.08em}
.sheet p{margin:0;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.fan{display:grid;gap:2px;font-variant-numeric:tabular-nums}
.fan div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.fan .tot{border-bottom:0;font:900 20px var(--sans);color:var(--accent)}
.hands{display:flex;flex-wrap:wrap;gap:6px 12px;--tw:clamp(18px,5.2vw,28px);align-items:flex-end}
.hands .hh{display:flex;flex-wrap:wrap;gap:1px}
.pay{display:grid;gap:4px}
.pay div{display:flex;justify-content:space-between;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.pos{color:#128048}.neg{color:#c63a26}
.rules{display:grid;gap:12px;color:var(--ink)}
.rules ul{margin:0;padding-left:1.2em;color:var(--muted)}
.rules li{margin:2px 0}
.ft{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.ft dt{color:var(--accent);font-weight:700;white-space:nowrap}
.ft dd{margin:0;color:var(--muted)}
.inp{font:500 15px var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;height:44px;padding:0 12px;min-width:0;flex:1}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.inp.code{flex:0 1 160px;text-transform:uppercase;letter-spacing:.2em;font-family:var(--mono)}
.warn{color:var(--hot)!important;font-weight:700}
.roomcode{font:700 44px/1 var(--mono);letter-spacing:.25em;color:var(--accent);padding:6px 0}
.linkbox{font:500 13px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.plist{display:grid;gap:6px}
.plist div{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:700}
.plist .empty{color:var(--muted);font-weight:400;border-style:dashed}

.cnt{display:none}
.btn.auto{border-color:var(--accent);color:var(--accent);font-weight:700;background:rgba(10,127,156,.08)}
.note.kq{color:var(--hot);font-weight:700;flex:1 1 100%}
.note.autoon{color:var(--accent);font-weight:700}
.resume{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--accent);background:rgba(10,127,156,.08);border-radius:12px}
.resume span{color:var(--muted)}
.mono{font-family:var(--mono);letter-spacing:.08em;color:var(--ink)}
/* ===== phone layout ===== */
@media (max-width:640px){
  :root{--rw:clamp(20px,6.2vw,28px);--mw:clamp(22px,6.6vw,30px)}
  body{font-size:15px;padding-block:8px 0;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .app{min-height:calc(100dvh - 8px);grid-template-rows:auto auto auto auto 1fr auto;gap:8px;align-content:start}
  .top{flex-wrap:nowrap;gap:6px}
  .top h1{font-size:17px;margin:0;letter-spacing:.12em;white-space:nowrap}
  .top .btn.sm{height:36px;padding:0 10px;font-size:13px}
  .opps{grid-template-columns:1fr;gap:8px}
  .seat{padding:8px 10px 10px;gap:6px;border-radius:12px}
  .sh{gap:6px}
  .nm{font-size:15px}
  .cnt{display:inline;color:var(--muted);font:500 12px var(--sans);white-space:nowrap}
  .rack .backs{--tw:12px;gap:5px}
  .rack{padding:5px 8px 6px}
  .rack.me{flex-direction:column;align-items:stretch;padding:0 6px 8px}
  .rack.me .rm{justify-content:flex-end;border-top:1px solid rgba(255,255,255,.28);padding-top:6px;margin-top:2px}
  .rack.me .rm .sep{display:none}
  .rack.me .meld,.rack.me .fl{--tw:clamp(24px,7.4vw,34px)}
  .rack.me .hand{justify-content:center}
  .row{min-height:0;gap:4px 8px}
  .row:empty{display:none}
  .river{padding-top:6px;gap:3px 2px;min-height:0}
  .river:empty{display:none}
  .mid{padding:8px 10px;gap:4px 10px;min-height:0;border-radius:12px}
  .mid .msg{font-size:16px;min-width:0;flex-basis:100%;order:-1}
  .mid .lastd{--tw:34px}
  .dock{position:sticky;bottom:0;margin:0 -10px;padding:10px 10px max(10px,env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line-2);box-shadow:0 -6px 18px rgba(30,40,60,.1)}
  .actions{min-height:0;gap:8px;margin-bottom:8px}
  .actions .btn{height:48px;font-size:16px;padding:0 20px;flex:1 1 auto;justify-content:center}
  .actions .btn.win{font-size:19px;flex:1 1 100%}
  .actions .note{font-size:14px;flex:1 1 100%}
  .claimtile{--tw:40px}
  .bt{--tw:22px}
  .hand{--hw:calc((100vw - 20px - 6*5px) / 7);flex-wrap:wrap;justify-content:center;gap:10px 5px;padding-top:12px;min-height:0}
  .hand .gap{display:none}
  .hand .t:hover{transform:none}
  .hand .t.sel{transform:translateY(-8px);outline-width:3px}
  .hand .t.dr{outline:2px solid var(--hot);outline-offset:1px}
  .sheet{padding:16px;border-radius:14px}
  .hands{--tw:clamp(20px,6.4vw,30px)}
  .btn,.chip{min-height:44px}
}
@media (prefers-reduced-motion:reduce){.call,.alert{animation:none}.hand .t{transition:none}}

[hidden]{display:none!important}
/* 收埋牌河 */
.tog{font:700 12px var(--sans);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer;margin-left:8px}
.tog:hover{border-color:var(--accent)}
.slim{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.slim b{color:var(--ink)}.slim .sl{display:inline-flex;align-items:center;gap:6px;--tw:20px}.slim .tog{margin-left:auto}
a.btn{text-decoration:none}
.qrrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.qrrow .linkbox{flex:1 1 200px;min-width:0}
.qr.sm{width:132px;height:132px;flex:none}
.qr{width:176px;height:176px;background:#fff;border-radius:8px;padding:6px;justify-self:center}.qr svg{width:100%;height:100%;display:block}
/* 牌河屏 */
#pondscreen{display:none}
body.pondmode{background:#12161d;color:#e8ecf2}
body.pondmode .app,body.pondmode #overlay{display:none}
body.pondmode #pondscreen{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;height:100dvh;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));font-family:var(--sans)}
.pshead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;color:#9aa5b8;font-size:14px}
.pshead b{color:#fff}.pshead>b:first-child{font-size:17px}.pshead .rm2{margin-left:auto;font-family:var(--mono)}
.psturn{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-height:30px}
.psturn .now{background:var(--hot);color:#fff;border-radius:999px;padding:3px 14px;font-weight:900;font-size:15px}.psturn .now.end{background:#3a4558}
.psturn .ld{color:#c3ccdb;font-size:15px}
.pswrap{position:relative;min-height:0}
#pspool{position:absolute;inset:0;overflow:hidden;background:#252d3a;border-radius:14px;padding:12px;min-height:0;box-sizing:border-box;align-content:flex-start}
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}

<script>
(function(){
'use strict';
var CANCEL={cancel:true};
var NUM=['一','二','三','四','五','六','七','八','九'];
var SUIT=['萬','筒','索'], WIND=['東','南','西','北'], DRAG=['中','發','白'], FLOW=['春','夏','秋','冬','梅','蘭','菊','竹'];
/* money per fan: PTS = discarder pays in full, PSELF = each player pays on a self-draw; cap is 8 fan */
var PTS={0:1,1:2,2:5,3:16,4:32,5:48,6:64,7:96,8:128};
var PSELF={0:1,1:1,2:3,3:8,4:16,5:24,6:32,7:48,8:64};
var CAP=8;
var AI_NAMES=['陳太','肥仔','阿Sir'];
var COARSE=(typeof matchMedia!=='undefined')&&matchMedia('(pointer: coarse)').matches;

function tname(t){return t<27?NUM[t%9]+SUIT[(t/9)|0]:t<31?WIND[t-27]:t<34?DRAG[t-31]:FLOW[t-34];}
function suitOf(t){return t<27?(t/9)|0:3;}
function isTerm(t){return t<27&&(t%9===0||t%9===8);}
function cnt(hand){var c=new Array(34).fill(0);for(var i=0;i<hand.length;i++){if(hand[i]<34)c[hand[i]]++;}return c;}
function removeOne(a,t){var i=a.indexOf(t);if(i>=0)a.splice(i,1);}
function removeN(a,t,n){for(var k=0;k<n;k++)removeOne(a,t);}
function fanLabel(ev){return ev.fan>=CAP?'滿貫':ev.fan+'番';}

/* ---------- tile faces ---------- */
var INK='#1c1a17',RED='#b3261e',GRN='#1f7a4d',BLU='#1d4e89',IV='#f7f1e1';
var DP=[null,[[20,28]],[[20,15],[20,41]],[[11,12],[20,28],[29,44]],[[12,16],[28,16],[12,40],[28,40]],[[11,14],[29,14],[20,28],[11,42],[29,42]],[[12,12],[28,12],[12,28],[28,28],[12,44],[28,44]],[[10,10],[20,15],[30,20],[12,38],[28,38],[12,49],[28,49]],[[12,10],[28,10],[12,22],[28,22],[12,34],[28,34],[12,46],[28,46]],[[10,12],[20,12],[30,12],[10,28],[20,28],[30,28],[10,44],[20,44],[30,44]]];
var DC=[null,[GRN],[GRN,BLU],[BLU,RED,GRN],[BLU,GRN,GRN,BLU],[GRN,GRN,RED,GRN,GRN],[GRN,GRN,RED,RED,RED,RED],[GRN,GRN,GRN,RED,RED,RED,RED],[BLU,BLU,BLU,BLU,BLU,BLU,BLU,BLU],[GRN,GRN,GRN,RED,RED,RED,BLU,BLU,BLU]];
var DR=[0,12,8,7,7.5,6.5,6.5,5.2,5.4,5.4];
var BP=[null,null,[[20,15],[20,41]],[[20,14],[11,41],[29,41]],[[12,15],[28,15],[12,41],[28,41]],[[11,14],[29,14],[20,28],[11,42],[29,42]],[[12,11],[28,11],[12,28],[28,28],[12,45],[28,45]],[[20,11],[10,29],[20,29],[30,29],[10,46],[20,46],[30,46]],[[8,15],[16,15],[24,15],[32,15],[8,41],[16,41],[24,41],[32,41]],[[10,11],[20,11],[30,11],[10,28],[20,28],[30,28],[10,45],[20,45],[30,45]]];
function dot(x,y,r,c){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.62).toFixed(1)+'" fill="none" stroke="'+IV+'" stroke-width="1"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.26).toFixed(1)+'" fill="'+IV+'"/>';}
function stickR(x,y,h,c,rot){var w=5.4,r=rot?' transform="rotate('+rot+' '+x+' '+y+')"':'';return '<g'+r+'><rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="2" fill="'+c+'"/><path d="M'+(x-w/2)+' '+(y-h/6)+'h'+w+'M'+(x-w/2)+' '+(y+h/6)+'h'+w+'" stroke="'+IV+'" stroke-width=".9"/></g>';}
function stick(x,y,h,c){var w=5.4;return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="2" fill="'+c+'"/><path d="M'+(x-w/2)+' '+(y-h/6)+'h'+w+'M'+(x-w/2)+' '+(y+h/6)+'h'+w+'" stroke="'+IV+'" stroke-width=".9"/>';}
function txt(ch,y,size,fill){return '<text x="20" y="'+y+'" text-anchor="middle" font-size="'+size+'" fill="'+fill+'">'+ch+'</text>';}
function face(t){
  var g='',i,n;
  if(t<9){g=txt(NUM[t],26,22,INK)+txt('萬',49,22,RED);}
  else if(t<18){n=t-8;for(i=0;i<DP[n].length;i++)g+=dot(DP[n][i][0],DP[n][i][1],DR[n],DC[n][i]);}
  else if(t<27){n=t-17;
    if(n===1){g='<ellipse cx="20" cy="33" rx="9" ry="12" fill="'+GRN+'"/><circle cx="20" cy="17" r="6.5" fill="'+GRN+'"/><path d="M26 15l8 3-8 3z" fill="'+RED+'"/><circle cx="22" cy="15.5" r="1.4" fill="'+IV+'"/><path d="M14 30q6 8 12 0" stroke="'+RED+'" stroke-width="2" fill="none"/><path d="M17 44l-4 8M23 44l4 8" stroke="'+RED+'" stroke-width="2"/>';}
    else if(n===8){/* 八索:每半邊左右兩條直條,中間兩條斜條,上半 Λ、下半 V */
      g=stickR(7,16,21,GRN,0)+stickR(33,16,21,GRN,0)+stickR(7,40,21,GRN,0)+stickR(33,40,21,GRN,0)+
        stickR(15.5,16,18.5,GRN,29)+stickR(24.5,16,18.5,GRN,-29)+stickR(15.5,40,18.5,GRN,-29)+stickR(24.5,40,18.5,GRN,29);}
    else{var h=(n===6||n===7||n===9)?14:19;
      for(i=0;i<BP[n].length;i++){var col=GRN;
        if((n===5&&i===2)||(n===7&&i===0)||(n===9&&(i%3===1)))col=RED;
        g+=stick(BP[n][i][0],BP[n][i][1],h,col);}}}
  else if(t<31){g=txt(WIND[t-27],38,32,INK);}
  else if(t===31){g=txt('中',40,34,RED);}
  else if(t===32){g=txt('發',40,34,GRN);}
  else if(t===33){g='<rect x="9" y="10" width="22" height="36" rx="3" fill="none" stroke="'+BLU+'" stroke-width="2.4"/>';}
  else{var k=t-34;var col2=k<4?'#b8541c':GRN;
    g='<circle cx="20" cy="26" r="16" fill="none" stroke="'+col2+'" stroke-width="1.2" opacity=".5"/>'+txt(FLOW[k],34,24,col2)+txt(String((k%4)+1),52,10,INK);}
  return '<svg viewBox="0 0 40 56" aria-hidden="true">'+g+'</svg>';
}
var FACE=[];for(var ft=0;ft<42;ft++)FACE.push(face(ft));
function tileEl(t,cls,tag){tag=tag||'span';return '<'+tag+' class="t '+(cls||'')+'" data-t="'+t+'">'+FACE[t]+'</'+tag+'>';}
var BACK='<span class="t back"></span>';

/* ---------- hand evaluation ---------- */
var ORPH=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function isThirteen(c){var tot=0,pair=0,i;for(i=0;i<34;i++)tot+=c[i];if(tot!==14)return false;var s=0;
  for(i=0;i<ORPH.length;i++){var v=c[ORPH[i]];if(v===0)return false;if(v===2)pair++;s+=v;}
  return pair===1&&s===14;}
function decomps(c,first){
  var out=[],sets=[];
  function rec(i,pair){
    while(i<34&&c[i]===0)i++;
    if(i>=34){out.push({pair:pair,sets:sets.slice()});return first;}
    if(c[i]>=3){c[i]-=3;sets.push({k:'pung',t:i});var s1=rec(i,pair);sets.pop();c[i]+=3;if(s1)return true;}
    if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;sets.push({k:'seq',t:i});var s2=rec(i,pair);sets.pop();c[i]++;c[i+1]++;c[i+2]++;if(s2)return true;}
    return false;
  }
  for(var t=0;t<34;t++){if(c[t]>=2){c[t]-=2;var st=rec(0,t);c[t]+=2;if(st)break;}}
  return out;
}
function scoreDecomp(d,p,ctx){
  var sets=p.melds.map(function(m){return {k:m.type==='chow'?'seq':'pung',t:m.tiles[0],kong:m.type==='kong',open:!m.concealed};})
    .concat(d.sets.map(function(s){return {k:s.k,t:s.t,kong:false,open:false};}));
  var pair=d.pair,tiles=[],i;
  sets.forEach(function(s){if(s.k==='seq')tiles.push(s.t,s.t+1,s.t+2);else tiles.push(s.t);});
  tiles.push(pair);
  var suits={},nsuit=0,honors=false,allTH=true;
  tiles.forEach(function(t){if(t>=27)honors=true;else if(!suits[suitOf(t)]){suits[suitOf(t)]=1;nsuit++;}if(!(t>=27||isTerm(t)))allTH=false;});
  var allPung=sets.every(function(s){return s.k==='pung';});
  var allSeq=sets.every(function(s){return s.k==='seq';});
  var rw=27+ctx.round,sw=27+p.wind;
  var dragons=sets.filter(function(s){return s.k==='pung'&&s.t>=31;});
  var winds=sets.filter(function(s){return s.k==='pung'&&s.t>=27&&s.t<31;});
  var limit=null;
  if(ctx.heaven)limit='天糊';
  else if(nsuit===0)limit='字一色';
  else if(allPung&&allTH&&!honors)limit='清么九';
  else if(winds.length===4)limit='大四喜';
  else if(sets.filter(function(s){return s.kong;}).length===4)limit='十八羅漢';
  else if(p.flowers.length===8)limit='八仙過海';
  if(limit)return {fan:CAP,items:[[limit,CAP]],limit:true};
  var items=[];
  if(ctx.self)items.push(['自摸',1]);
  if(sets.every(function(s){return !s.open;}))items.push(['門前清',1]);
  if(allPung&&allTH&&honors)items.push(['混么九',7]);
  else if(allPung)items.push(['對對糊',3]);
  if(nsuit===1&&!honors)items.push(['清一色',7]);
  else if(nsuit===1&&honors)items.push(['混一色',3]);
  if(allSeq&&pair<27&&true)items.push(['平糊',1]);
  if(dragons.length===3)items.push(['大三元',8]);
  else if(dragons.length===2&&pair>=31)items.push(['小三元',5]);
  else dragons.forEach(function(s){items.push(['三元牌 '+DRAG[s.t-31],1]);});
  if(winds.length===3&&pair>=27&&pair<31)items.push(['小四喜',6]);
  else winds.forEach(function(s){if(s.t===rw)items.push(['圈風 '+WIND[ctx.round],1]);if(s.t===sw)items.push(['門風 '+WIND[p.wind],1]);});
  if(ctx.self&&ctx.kongDraw)items.push(['槓上開花',1]);
  if(ctx.last)items.push([ctx.self?'海底撈月':'河底撈魚',1]);
  var f=p.flowers;
  if(f.length===0)items.push(['無花',1]);
  else{var m=0;f.forEach(function(t){if((t-34)%4===p.wind)m++;});
    if(m)items.push(['正花'+(m>1?' ×'+m:''),m]);
    var a=[34,35,36,37].every(function(t){return f.indexOf(t)>=0;}),b=[38,39,40,41].every(function(t){return f.indexOf(t)>=0;});
    if(a||b)items.push(['一台花',2]);}
  var tot=0;items.forEach(function(x){tot+=x[1];});
  return {fan:Math.min(CAP,tot),items:items,limit:false};
}
function evalWin(p,ctx){
  var c=cnt(p.hand),tot=0,i;for(i=0;i<34;i++)tot+=c[i];
  var ns=4-p.melds.length;
  if(tot!==ns*3+2)return null;
  var best=null;
  if(p.melds.length===0&&isThirteen(c))best={fan:CAP,items:[['十三么',CAP]],limit:true};
  var ds=decomps(c,false);
  for(i=0;i<ds.length;i++){var r=scoreDecomp(ds[i],p,ctx);if(!best||r.fan>best.fan)best=r;}
  return best;
}
function evalWith(p,t,ctx){p.hand.push(t);var ev=evalWin(p,ctx);p.hand.pop();return ev;}

/* ---------- AI ---------- */
var shCache=new Map();
function shanten(c,melds){
  var key=c.join('')+'|'+melds;
  var hit=shCache.get(key);if(hit!==undefined)return hit;
  var best=8;
  function dfs(i,sets,part,pair){
    while(i<34&&c[i]===0)i++;
    if(i>=34){var p=Math.min(part,4-sets);var s=8-2*sets-p-pair;if(s<best)best=s;return;}
    if(c[i]>=3){c[i]-=3;dfs(i,sets+1,part,pair);c[i]+=3;}
    if(c[i]>=2){
      if(!pair){c[i]-=2;dfs(i,sets,part,1);c[i]+=2;}
      c[i]-=2;dfs(i,sets,part+1,pair);c[i]+=2;
    }
    if(i<27){var r=i%9;
      if(r<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;dfs(i,sets+1,part,pair);c[i]++;c[i+1]++;c[i+2]++;}
      if(r<=7&&c[i+1]>0){c[i]--;c[i+1]--;dfs(i,sets,part+1,pair);c[i]++;c[i+1]++;}
      if(r<=6&&c[i+2]>0){c[i]--;c[i+2]--;dfs(i,sets,part+1,pair);c[i]++;c[i+2]++;}
    }
    c[i]--;dfs(i,sets,part,pair);c[i]++;
  }
  dfs(0,melds,0,0);
  if(shCache.size>60000)shCache.clear();
  shCache.set(key,best);
  return best;
}
function visible(p){
  var v=new Array(34).fill(0);
  S.players.forEach(function(q){q.discards.forEach(function(t){v[t]++;});q.melds.forEach(function(m){m.tiles.forEach(function(t){v[t]++;});});});
  p.hand.forEach(function(t){if(t<34)v[t]++;});
  return v;
}
function lean(p){
  var sc=[0,0,0],hon=0;
  var all=p.hand.slice();p.melds.forEach(function(m){all=all.concat(m.tiles);});
  all.forEach(function(t){if(t>=34)return;if(t>=27)hon++;else sc[suitOf(t)]++;});
  var main=0;for(var i=1;i<3;i++)if(sc[i]>sc[main])main=i;
  return {main:main,n:sc[main]+hon,total:all.length};
}
/* ---- stronger AI (level 2): reads opponents, defends, aims for enough fan ---- */
function threatOf(q){
  var th=0.05,open=q.melds.filter(function(m){return !m.concealed;}).length;
  th+=0.3*open;
  if(q.melds.some(function(m){var t=m.tiles[0];return m.type!=='chow'&&(t>=31||t===27+S.round||t===27+q.wind);}))th+=0.35;
  var suits={},ns=0;
  q.melds.forEach(function(m){var t=m.tiles[0];if(t<27&&!suits[suitOf(t)]){suits[suitOf(t)]=1;ns++;}});
  if(q.melds.length>=2&&ns===1)th+=0.4;
  var live=S.wall.length;
  if(live<40)th+=0.1;
  if(live<20)th+=0.2;
  return Math.min(th,1.5);
}
function flushSuitOf(q){
  var suits={},ns=0,s=-1,x;
  q.melds.forEach(function(m){var t=m.tiles[0];if(t<27&&!suits[suitOf(t)]){suits[suitOf(t)]=1;ns++;s=suitOf(t);}});
  if(q.melds.length>=2&&ns===1)return s;
  if(q.discards.length>=6){
    var dc=[0,0,0];q.discards.forEach(function(t){if(t<27)dc[suitOf(t)]++;});
    for(x=0;x<3;x++){if(dc[x]===0&&dc[(x+1)%3]+dc[(x+2)%3]>=5)return x;}
  }
  return -1;
}
function danger(p,t,vis){
  var total=0;
  S.players.forEach(function(q){
    if(q===p)return;
    if(q.discards.indexOf(t)>=0)return;
    var th=threatOf(q),pr;
    if(t>=27){
      pr=vis[t]>=3?0.02:0.12*(4-vis[t])/3;
      if(t>=31||t===27+S.round||t===27+q.wind)pr*=1.4;
    }else{
      var r=t%9;
      pr=(r===0||r===8)?0.09:(r===1||r===7)?0.15:0.22;
      if(r>=3&&q.discards.indexOf(t-3)>=0)pr*=0.6;
      if(r<=5&&q.discards.indexOf(t+3)>=0)pr*=0.6;
      var fs=flushSuitOf(q);
      if(fs>=0)pr*=(suitOf(t)===fs)?2.2:0.5;
    }
    total+=th*pr*3;
  });
  return total;
}
function estFan(p,c,melds){
  var f=0,i,open=false,suits={},ns=0,hon=false;
  melds.forEach(function(m){if(!m.concealed)open=true;});
  if(!open)f+=1;
  f+=1;
  if(!p.flowers.length)f+=1;else p.flowers.forEach(function(t){if((t-34)%4===p.wind)f+=1;});
  var rw=27+S.round,sw=27+p.wind;
  function fv(t){return (t>=31?1:0)+(t===rw?1:0)+(t===sw?1:0);}
  for(i=27;i<34;i++){
    var has=false;
    melds.forEach(function(m){if(m.type!=='chow'&&m.tiles[0]===i)has=true;});
    if(has||c[i]>=3)f+=fv(i);else if(c[i]===2)f+=fv(i)*0.5;
  }
  var mc=[0,0,0];
  for(i=0;i<34;i++){if(!c[i])continue;if(i>=27)hon=true;else{mc[suitOf(i)]+=c[i];}}
  melds.forEach(function(m){var t=m.tiles[0];if(t>=27)hon=true;else mc[suitOf(t)]+=3;});

  if(v.a==='pass')return true;
  if(v.a==='win')return !!(o.ev&&o.ev.fan>=S.minFan);
  if(v.a==='pung')return !!o.pung;
  if(v.a==='kong')return !!o.kong;
  if(v.a==='chow'&&v.seq&&v.seq.length===2)return (o.chows||[]).some(function(s){return s[0]===v.seq[0]&&s[1]===v.seq[1];});
  return false;
}
function answerSeat(seat,id,v){
  var a=S.asks[seat];
  if(!a||a.id!==id||!validAnswer(seat,a,v))return;
  if(v.a==='auto')v=autoHumanAnswer(S.players[seat],a);
  delete S.asks[seat];a.res(v);render();
}
function autoAnswer(p,a){
  var o=a.opts;
  if(a.kind==='turn'){if(o.claimed)return {a:'discard',t:chooseDiscard(p)};return aiTurn(p,o.ev,o.kongs);}
  if(o.ev&&o.ev.fan>=S.minFan)return {a:'win'};
  if(o.pung){var d=aiPung(p,o.tile,!!o.kong);if(d==='kong')return {a:'kong'};if(d)return {a:'pung'};}
  if(o.chows&&o.chows.length){var s=aiChow(p,o.tile,o.chows);if(s)return {a:'chow',seq:s};}
  return {a:'pass'};
}
function takeover(seat){
  var p=S.players[seat];if(!p||!p.human)return;
  p.baseName=p.name;p.away=!!p.pid;p.human=false;p.remote=false;p.level=S.level;p.name=p.name+'(電腦)';

  render();
}

/* ---------- game flow (host / single player) ---------- */
function callout(i,text){var id=++callId;S.call={i:i,text:text,id:id};render();setTimeout(function(){if(S.call&&S.call.id===id){S.call=null;render();}},1100);}
function buildWall(){
  var w=[],t,k;
  for(t=0;t<34;t++)for(k=0;k<4;k++)w.push(t);
  for(t=34;t<42;t++)w.push(t);
  for(var i=w.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=w[i];w[i]=w[j];w[j]=x;}
  return w;
}
function sortHand(p){p.hand.sort(function(a,b){return a-b;});}
function drawTile(p,fromBack){
  for(;;){
    if(S.wall.length<=0)return false;
    var t=fromBack?S.wall.pop():S.wall.shift();
    if(t>=34){p.flowers.push(t);S.msg=p.name+' 補花 '+tname(t);fromBack=true;continue;}
    p.hand.push(t);sortHand(p);p.drawn=t;return true;
  }
}
function replaceFlowers(p){
  for(;;){
    var idx=-1;for(var i=0;i<p.hand.length;i++)if(p.hand[i]>=34){idx=i;break;}
    if(idx<0)return;
    p.flowers.push(p.hand.splice(idx,1)[0]);
    p.hand.push(S.wall.pop());
  }
}
function kongOptions(p){
  if(S.wall.length<=0)return [];
  var c=cnt(p.hand),out=[];
  for(var t=0;t<34;t++){
    if(c[t]===4)out.push(t);
    else if(c[t]>=1&&p.melds.some(function(m){return m.type==='pung'&&m.tiles[0]===t;}))out.push(t);
  }
  return out;
}
function doKong(p,t){
  var c=cnt(p.hand);
  if(c[t]===4){removeN(p.hand,t,4);p.melds.push({type:'kong',tiles:[t,t,t,t],concealed:true});}
  else{removeOne(p.hand,t);var m=p.melds.filter(function(m){return m.type==='pung'&&m.tiles[0]===t;})[0];m.type='kong';m.tiles.push(t);}
  p.drawn=null;
}
function chowOptions(p,t){
  if(t>=27)return [];
  var c=cnt(p.hand),r=t%9,out=[];
  if(r>=2&&c[t-2]&&c[t-1])out.push([t-2,t-1]);
  if(r>=1&&r<=7&&c[t-1]&&c[t+1])out.push([t-1,t+1]);
  if(r<=6&&c[t+1]&&c[t+2])out.push([t+1,t+2]);
  return out;
}
function doClaim(s,d,t,kind,seq){
  var p=S.players[s],from=S.players[d];
  from.discards.pop();S.pond.pop();
  if(kind==='pung'){removeN(p.hand,t,2);p.melds.push({type:'pung',tiles:[t,t,t],from:d});}
  else if(kind==='kong'){removeN(p.hand,t,3);p.melds.push({type:'kong',tiles:[t,t,t,t],from:d});}
  else{removeOne(p.hand,seq[0]);removeOne(p.hand,seq[1]);p.melds.push({type:'chow',tiles:[seq[0],seq[1],t].sort(function(a,b){return a-b;}),from:d});}
  p.drawn=null;S.last=null;
  var label=kind==='pung'?'碰':kind==='kong'?'槓':'上';
  S.msg=p.name+' '+label+' '+tname(t);
  callout(s,label);
}

async function resolveClaims(d,t){
  var n=S.n,P=S.players,order=[],k;
  for(k=1;k<n;k++)order.push((d+k)%n);
  var last=S.wall.length<=0,i,s,p,a;
  for(i=0;i<order.length;i++){
    s=order[i];p=P[s];
    var ev=evalWith(p,t,{self:false,round:S.round,last:last});
    if(!ev||ev.fan<S.minFan)continue;
    if(p.human){a=await ask(s,'claim',{tile:t,from:d,ev:ev});if(a.a==='win')return {type:'win',seat:s,ev:ev,tile:t};}
    else return {type:'win',seat:s,ev:ev,tile:t};
  }
  var asked={};
  for(i=0;i<order.length;i++){
    s=order[i];p=P[s];
    var c=cnt(p.hand);
    if(c[t]<2)continue;
    var canKong=c[t]>=3&&S.wall.length>0;
    if(p.human){
      var chows=(i===0)?chowOptions(p,t):[];
      asked[s]=true;
      a=await ask(s,'claim',{tile:t,from:d,pung:true,kong:canKong,chows:chows});
      if(a.a==='pung'||a.a==='kong'){doClaim(s,d,t,a.a);return {type:a.a,seat:s};}
      if(a.a==='chow'){doClaim(s,d,t,'chow',a.seq);return {type:'chow',seat:s};}
    }else{
      var dec=aiPung(p,t,canKong);
      if(dec){await T(450);doClaim(s,d,t,dec);return {type:dec,seat:s};}
    }
  }
  s=order[0];p=P[s];
  var opts=chowOptions(p,t);
  if(opts.length){
    if(p.human){
      if(!asked[s]){a=await ask(s,'claim',{tile:t,from:d,chows:opts});if(a.a==='chow'){doClaim(s,d,t,'chow',a.seq);return {type:'chow',seat:s};}}
    }else{
      var seq=aiChow(p,t,opts);
      if(seq){await T(450);doClaim(s,d,t,'chow',seq);return {type:'chow',seat:s};}
    }
  }
  return {type:'none'};
}

function endWin(w,from,ev,self,tile){
  var P=S.players,base=PTS[ev.fan],deltas=P.map(function(){return 0;});
  if(!self){P[from].discards.pop();S.pond.pop();P[w].hand.push(tile);}
  sortHand(P[w]);
  if(self){var each=S.n===2?PTS[ev.fan]:PSELF[ev.fan];   /* 2 players: self-draw is paid in full like a discard win */P.forEach(function(p,i){if(i!==w){deltas[i]-=each;deltas[w]+=each;}});}
  else{deltas[from]-=base;deltas[w]+=base;}
  P.forEach(function(p,i){p.score+=deltas[i];p.drawn=null;});
  S.over=true;S.ready={};armNext();S.winTile=tile;S.last=null;S.result={type:'win',winner:w,from:from,self:self,ev:ev,deltas:deltas};
  S.msg=P[w].name+(self?' 自摸':' 食糊');
  callout(w,self?'自摸':'胡');
  snapshot('over');
  render();
}
function endDraw(){
  S.over=true;S.ready={};armNext();S.last=null;S.result={type:'draw'};S.msg='流局';
  snapshot('over');
  S.players.forEach(function(p){p.drawn=null;});
  render();
}

async function playHand(resume){
  var n=S.n,P=S.players,d=S.dealer,k;
  S.over=false;S.result=null;S.winTile=null;S.call=null;S.ready={};
  if(!resume){
    S.players.forEach(function(q){q.auto=false;});
    S.wall=buildWall();S.last=null;S.discN=0;
    S.msg='洗牌、起牌…';
    P.forEach(function(p,i){p.hand=[];p.melds=[];p.flowers=[];p.discards=[];p.drawn=null;p.wind=(i-d+n)%n;});S.pond=[];
    for(var r=0;r<13;r++)for(k=0;k<n;k++)P[(d+k)%n].hand.push(S.wall.shift());
    for(k=0;k<n;k++)replaceFlowers(P[(d+k)%n]);
    P.forEach(sortHand);
    S.cur=d;render();await T(700);
  }else{S.msg='繼續上次牌局';render();await T(400);}
  var mode=resume?'resume':'draw',kongDraw=false;
  for(;;){
    var p=P[S.cur];
    var heaven=false;
    if(mode==='resume'){kongDraw=!!resume.kongDraw;heaven=!!resume.heaven;mode=resume.claimed?'claimed':'resumed';}
    else if(mode==='draw'){if(!drawTile(p,false))return endDraw();kongDraw=false;heaven=(S.cur===d&&S.discN===0);}
    else if(mode==='kongdraw'){if(!drawTile(p,true))return endDraw();kongDraw=true;}
    render();
    var ev=null,kongs=[];
    if(mode!=='claimed'){
      ev=evalWin(p,{self:true,round:S.round,kongDraw:kongDraw,last:S.wall.length<=0,heaven:heaven});
      kongs=kongOptions(p);
    }
    var act;
    if(p.human){snapshot('turn',{claimed:mode==='claimed',kongDraw:kongDraw,heaven:heaven});act=await ask(S.cur,'turn',{ev:ev,kongs:kongs,claimed:mode==='claimed',kongDrawn:(mode!=='claimed'&&p.drawn!=null&&kongs.indexOf(p.drawn)>=0)?p.drawn:null});}
    else{S.msg=p.name+' 思考中…';render();await T(650);act=aiTurn(p,ev,kongs);}
    if(act.a==='win')return endWin(S.cur,null,ev,true,p.drawn);
    if(act.a==='kong'){
      doKong(p,act.t);S.msg=p.name+' 槓 '+tname(act.t);callout(S.cur,'槓');await T(650);
      mode='kongdraw';continue;
    }
    var t=act.t;
    removeOne(p.hand,t);p.drawn=null;p.discards.push(t);S.pond.push(S.cur);S.last={seat:S.cur,t:t};S.discN++;
    S.msg=p.name+' 打出 '+tname(t);render();
    await T(350);
    var res=await resolveClaims(S.cur,t);
    if(res.type==='win')return endWin(res.seat,S.cur,res.ev,false,res.tile);
    if(res.type==='none'){S.cur=(S.cur+1)%n;mode='draw';continue;}
    S.cur=res.seat;mode=res.type==='kong'?'kongdraw':'claimed';
    await T(300);
  }
}
function runGame(resume){playHand(resume).catch(function(e){if(e!==CANCEL)console.error(e);});}

function startGame(){
  S.token++;S.asks={};S.ready={};
  var n=U.cfg.n,mem=U.role==='host'?NET.members:[];
  S.n=n;S.minFan=U.cfg.minFan;S.level=U.cfg.level;
  S.players=[];
  var used={},ai=0;
  function uniq(nm){var x=nm,k=2;while(used[x]){x=nm+k;k++;}used[x]=1;return x;}
  for(var i=0;i<n;i++){
    var m=i===0?null:mem[i-1];
    var human=i===0||!!m;
    var name=i===0?(U.role==='solo'?'你':uniq(myName())):(m?uniq(m.name):uniq(AI_NAMES[ai++]));
    S.players.push({id:i,name:name,human:human,remote:!!m,score:1000,level:S.level,hand:[],melds:[],flowers:[],discards:[],wind:0,drawn:null});
    if(m){m.seat=i;S.players[i].pid=m.pid||'';}
  }
  mem.forEach(function(m,j){if(j>=n-1)m.seat=-1;});
  S.dealer=0;S.round=0;S.handNo=1;S.lian=0;S.over=false;S.running=true;
  if(U.role==='solo')dropSave(true);
  U.screen='game';U.rules=false;U.modalHidden=false;
  runGame();render();
}
var NEXT_SEC=20;
function armNext(){
  clearTimeout(S.nextT);S.nextAt=Date.now()+NEXT_SEC*1000;
  var tok=S.token,hn=S.handNo;
  S.nextT=setTimeout(function(){if(S.running&&S.over&&S.token===tok&&S.handNo===hn)nextHand();},NEXT_SEC*1000+50);
  setTimeout(function(){if(S.running&&S.over&&S.token===tok&&S.handNo===hn){S.players.forEach(function(p){if(p.human&&p.proxy)S.ready[p.id]=1;});render();checkReady();}},3500);
}
function cdLeft(){
  if(!V||!V.over)return null;
  if(U.role==='client'||U.role==='pond'){return V.dl?Math.max(0,V.dl-Date.now()):null;}
  return S.nextAt?Math.max(0,S.nextAt-Date.now()):null;
}
function cdText(){var l=cdLeft();return l==null?'':Math.ceil(l/1000)+' 秒後自動開下一局';}
function nextHand(){
  var r=S.result;if(!S.over||!r)return;
  clearTimeout(S.nextT);S.nextAt=0;
  if(r.type==='draw'||r.winner===S.dealer){S.lian++;}
  else{S.lian=0;S.dealer=(S.dealer+1)%S.n;if(S.dealer===0)S.round=(S.round+1)%4;}
  S.handNo++;S.ready={};U.modalHidden=false;
  runGame();render();
}
function checkReady(){
  if(!S.over)return;
  var hs=S.players.filter(function(p){return p.human;});
  if(hs.every(function(p){return S.ready[p.id]||p.proxy;}))nextHand();
}

function mqHost(code,onConn,onReady,onFail){

function mqGuest(code){

    if(closed){if(c)try{c.end(true);}catch(e){}return;}
    if(err){conn.emit('error',{type:'broker'});return;}

function sbHost(code,onConn,onReady,onFail){
  var hub={conns:{},closed:false,ready:false,lobby:null,iv:null};
  var lobby=sbChan('hk-'+code);hub.lobby=lobby;
  function accept(cid){
    var old=hub.conns[cid];

    var conn=mqConn(function(o){try{ch.send({type:'broadcast',event:'h2g',payload:o});}catch(e){}});

function onHostConn(conn){

  function admit(d){
    if(S.running&&d&&d.pid){
      var si=-1;
      S.players.forEach(function(p,i){if(p.pid&&p.pid===d.pid&&p.remote!==undefined&&(p.away||p.remote))si=i;});
      if(si>=0){
        var old=NET.members.filter(function(x){return x.seat===si;})[0];
        if(old){NET.members.splice(NET.members.indexOf(old),1);old.seat=-1;try{old.conn.close();}catch(e){}}
        var pl=S.players[si];
        pl.human=true;pl.remote=true;pl.away=false;pl.auto=false;pl.proxy=false;if(pl.baseName)pl.name=pl.baseName;
        m.seat=si;m.joined=true;m.pid=d.pid;m.name=pl.name;NET.members.push(m);
        safeSend(conn,{t:'view',v:buildView(si)});render();

    if(NET.members.length>=U.cfg.n-1){safeSend(conn,{t:'full',msg:'房已經夠人。'});setTimeout(function(){try{conn.close();}catch(e){}},300);return false;}

    if(d.t==='hello'){
      if(d.role==='pond'){
        if(!m.pond&&!m.joined){m.pond=true;NET.ponds.push(m);}
        safeSend(conn,lobbyInfo());
        if(S.running)safeSend(conn,{t:'pond',v:pondView()});
        return;
      }
      if(!m.joined){m.pid=String(d.pid||'').slice(0,24);if(!admit(d))return;if(m.seat>=0)return;}
      m.name=String(d.name||m.name).slice(0,8);sendLobby();render();
    }

    else if(d.t==='proxy'){if(m.seat>=0)setProxy(m.seat,!!d.on);}
    else if(d.t==='ready'){if(m.seat>=0&&S.over){S.ready[m.seat]=1;render();checkReady();}}
  });

    var i=NET.members.indexOf(m);if(i<0)return;
    if(!S.running){NET.members.splice(i,1);sendLobby();render();}
    else{var seat=m.seat;m.seat=-1;NET.members.splice(i,1);if(seat>=0){takeover(seat);checkReady();}}
  });

    var w=P[r.winner];
    h+='<h2>'+esc(w.name)+(r.self?' 自摸':' 食糊')+(r.self?'':'(出銃:'+esc(P[r.from].name)+')')+'</h2>';
    h+='<div class="hands"><span class="hh">'+w.melds.map(function(m){return '<span class="meld" style="margin-right:6px;display:inline-flex;gap:1px">'+faces(m.tiles)+'</span>';}).join('')+'</span>'+
       '<span class="hh">'+faces(w.hand||[])+'</span></div>';
    h+='<div class="fan">'+r.ev.items.map(function(x){return '<div><span>'+x[0]+'</span><span>'+(r.ev.limit?'滿貫':x[1]+' 番')+'</span></div>';}).join('')+
       '<div class="tot"><span>合共</span><span>'+fanLabel(r.ev)+'</span></div></div>';
  }
  h+='<div class="pay">'+P.map(function(p,i){
    var d=r.deltas?r.deltas[i]:0;
    return '<div><span>'+esc(p.name)+'</span><span><span class="'+(d>0?'pos':d<0?'neg':'')+'">'+(d>0?'+':'')+d+'</span> · '+p.score.toLocaleString()+'</span></div>';
  }).join('')+'</div>';
  if(pond){return h+'<p class="note" style="text-align:center">等玩家開下一局…<span class="cdn" data-cd> '+cdText()+'</span></p></div></div>';}
  var humans=P.filter(function(p){return p.human;}).length,mine=V.ready.indexOf(V.me)>=0;
  h+='<div class="opts">'+(mine?'<button class="btn" disabled>等緊其他玩家 ('+V.ready.length+' / '+humans+')</button>':'<button class="btn pri" data-act="next">下一局</button>')+'<button class="btn" data-act="hideModal">睇牌桌</button></div><p class="note cdn" data-cd style="text-align:center;margin:8px 0 0">'+cdText()+'</p></div></div>';
  return h;
}
function drawOverlay(){
  var h='';
  if(U.rules)h=rulesHTML();
  else if(U.share&&(U.role==='host'||U.pondOnly))h=shareHTML();
  else if(U.screen==='setup')h=setupHTML();
  else if(U.screen==='lobby')h=lobbyHTML();
  else if(V&&V.over&&V.result&&!U.modalHidden)h=resultHTML();
  if(els.overlay.getAttribute('data-h')===h&&U.screen!=='x')return;
  els.overlay.setAttribute('data-h',h);
  els.overlay.innerHTML=h;
}
function draw(){
  if(U.pondMode){drawPondScreen();return;}
  if(!els.opps)return;
  if(V&&!V.over)U.modalHidden=false;
  drawOpps();drawMe();drawPond();drawMid();drawDock();drawOverlay();
  els.speed.textContent='速度:'+(S.speed===1?'標準':'快');
  els.speed.hidden=U.role==='client';
  if(els.share)els.share.hidden=!((U.role==='host'&&U.code)||(U.role==='solo'&&V));
}
function render(){
  if(U.role!=='client'&&U.role!=='pond'){V=buildView(0);broadcast();}
  draw();
}

/* ---------- events ---------- */
function handleAct(act,b){
  var v=b?b.getAttribute('data-v'):null;
  if(act==='cfgN'){U.cfg.n=+v;render();}
  else if(act==='cfgF'){U.cfg.minFan=+v;render();}
  else if(act==='cfgL'){U.cfg.level=+v;render();}
  else if(act==='solo'){U.role='solo';U.notice='';startGame();}
  else if(act==='resume')resumeGame();
  else if(act==='dropsave'){dropSave();render();}
  else if(act==='loadcode'){loadCloudSave(U.codeInput||'',true);}
  else if(act==='host')hostOpen();
  else if(act==='join')joinRoom();
  else if(act==='startRoom'){if(U.role==='host'&&!S.running&&U.code)startGame();}
  else if(act==='leave'||act==='setup'){U.rejoin='';leaveAll();U.notice='';render();}
  else if(act==='copy'){
    var link=location.origin+location.pathname+'?room='+U.code;
    try{navigator.clipboard.writeText(link).then(function(){U.copied=true;render();},function(){});}catch(e){}
  }
  else if(act==='sharePond'){
    U.share=true;U.copiedPond=false;
    if(U.role==='solo'&&!U.pondOnly){
      U.pondOnly=true;U.pondFail=false;U.code='';NET.members=[];
      if(!rtcOK()&&!mqOK()&&!sbOK())U.pondFail=true;else openRoom(0);
    }
    render();
  }
  else if(act==='closeShare'){U.share=false;render();}
  else if(act==='copyPond'){
    try{navigator.clipboard.writeText(pondLink()).then(function(){U.copiedPond=true;render();},function(){});}catch(e){}
  }
  else if(act==='togPond'){U.pondHidden=!U.pondHidden;try{localStorage.setItem('mj_pondHide',U.pondHidden?'1':'0');}catch(e){}draw();}
  else if(act==='rules'){U.rules=true;render();}
  else if(act==='closeRules'){U.rules=false;render();}
  else if(act==='speed'){S.speed=S.speed===1?0.4:1;render();}
  else if(act==='next'){
    if(!V||!V.over)return;
    if(U.role==='client'){safeSend(NET.conn,{t:'ready'});V.ready=(V.ready||[]).concat([V.me]);draw();}
    else{S.ready[0]=1;render();checkReady();}
  }
  else if(act==='hideModal'){U.modalHidden=true;draw();}
  else if(act==='takeover'){if(U.role==='host')takeover(+b.getAttribute('data-seat'));}
  else if(act==='discardsel'){if(U.selT!=null)answer({a:'discard',t:U.selT});}
  else if(act==='proxy'){
    if(!V)return;
    if(U.role==='client'){safeSend(NET.conn,{t:'proxy',on:!V.proxy});V.proxy=!V.proxy;draw();}
    else setProxy(0,!V.proxy);
  }
  else if(act==='auto'){
    if(!V)return;
    if(U.role==='client'){safeSend(NET.conn,{t:'auto',on:!V.auto});}
    else setAuto(0,!V.auto);
  }
  else if(act==='nokong'){if(!V||!V.ask)return;if(V.auto)answer({a:'auto'});else{U.kqDismiss=V.ask.id;draw();}}
  else if(act==='win')answer({a:'win'});
  else if(act==='kong')answer({a:'kong',t:+b.getAttribute('data-t')});
  else if(act==='claimkong')answer({a:'kong'});
  else if(act==='pung')answer({a:'pung'});
  else if(act==='chow'){var q=b.getAttribute('data-seq').split(',').map(Number);answer({a:'chow',seq:q});}
  else if(act==='pass')answer({a:'pass'});
}
/* ---------- 牌河屏(只讀,用 ?pond=房號 開) ---------- */
function pondLink(){return location.origin+location.pathname+'?pond='+U.code;}
function qrSVG(text){
  try{if(typeof window.qrcode!=='function')return '';var q=window.qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});}catch(e){return '';}
}
function shareHTML(){
  if(!U.code){
    return '<div class="ov"><div class="sheet"><h2>開牌河屏</h2><p>'+(U.pondFail?'連唔到網絡,開唔到牌河屏。請檢查網絡後再試。':'開緊房…')+'</p><div class="opts"><button class="btn pri" data-act="closeShare">收起</button></div></div></div>';
  }
  var link=pondLink(),qr=qrSVG(link);
  return '<div class="ov"><div class="sheet"><h2>開牌河屏</h2><p>用平板、電視或者另一部手機打開以下連結,就會見到成個牌河,連碰槓牌、花牌、分數同每局結果,但睇唔到任何人嘅手牌。</p>'+
    (qr?'<div class="qr">'+qr+'</div>':'')+'<div class="linkbox">'+esc(link)+'</div>'+
    '<div class="opts"><button class="btn sm" data-act="copyPond">'+(U.copiedPond?'已複製':'複製連結')+'</button><a class="btn sm" href="'+esc(link)+'" target="_blank" rel="noopener">喺新分頁開</a><button class="btn pri" data-act="closeShare">收起</button></div></div></div>';
}
function keepAwake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}}
function fitPond(){
  var pool=document.getElementById('pspool');if(!pool||!V)return;
  var n=Math.max(24,Math.ceil(((V.pond||[]).length+1)/8)*8);
  var W=pool.clientWidth-24,H=pool.clientHeight-24,best=16;
  for(var tw=96;tw>=16;tw-=2){
    var cols=Math.max(1,Math.floor((W+3)/(tw+3))),rows=Math.ceil(n/cols);
    if(rows*(tw*1.36+11)<=H){best=tw;break;}
  }
  pool.style.setProperty('--tw',best+'px');
}
function drawPondScreen(){
  var root=document.getElementById('pondscreen');if(!root)return;
  var code=esc(U.roomInput||'');
  if(!V){
    var l=NET.lobby;
    root.innerHTML='<div class="pshead"><b>牌河屏</b><span>房號 '+code+'</span></div><div class="pswait"><h2>'+(l?'已連上房間':'連線中…')+'</h2><p>'+esc(NET.state||'')+'</p>'+
      (l?'<p>玩家:'+l.players.map(esc).join('、')+'</p><p>等房主開始遊戲…</p>':'')+'</div>';
    return;
  }
  var P=V.players,n=(V.pond||[]).length;
  var info=WIND[V.round]+'風圈 · 第'+V.handNo+'局 · 莊 '+esc(P[V.dealer].name)+(V.lian?' ×'+V.lian:'');
  var turn=V.over?'<span class="now end">本局完</span>':'<span class="now">輪到 '+esc(P[V.cur].name)+'</span>';
  var lastd=V.last?'<span class="ld">'+esc(P[V.last.seat].name)+' 打出 '+tname(V.last.t)+'</span>':'';
  var tiles=(V.pond||[]).map(function(e,j){return tileEl(e.t,'s'+e.s+(j===n-1&&V.last?' last':''));}).join('');
  var cards=P.map(function(p,i){
    var call=(V.call&&V.call.i===i)?'<span class="call">'+esc(V.call.text)+'</span>':'';
    return '<div class="pc2 s'+i+(V.cur===i&&!V.over?' on':'')+'">'+call+'<div class="pch"><span class="wchip">'+WIND[p.wind]+'</span><span class="nm">'+esc(p.name)+'</span>'+(i===V.dealer?'<span class="dl">莊</span>':'')+'<span class="sc">'+p.score.toLocaleString()+'</span></div>'+
      '<div class="pcm">'+(p.melds.length?meldsHTML(p,false):'')+flowersHTML(p)+(!p.melds.length&&!p.flowers.length?'<span class="none">未有碰槓或花牌</span>':'')+'</div></div>';
  }).join('');
  root.innerHTML='<div class="pshead"><b>'+info+'</b><span>牌牆 <b>'+V.live+'</b></span><span>已打 <b>'+n+'</b> 張</span><span class="rm2">房號 '+code+'</span></div>'+
    '<div class="psturn">'+turn+lastd+'</div>'+
    '<div class="pswrap"><div class="pool" id="pspool">'+tiles+'</div></div>'+
    '<div class="pstrip">'+cards+'</div>'+
    (V.over&&V.result?resultHTML(true):'');
  fitPond();
}
function onClick(e){
  var b=e.target.closest('[data-act]');
  if(b){handleAct(b.getAttribute('data-act'),b);return;}
  var k=e.target.closest('[data-k]');
  if(k&&V&&V.ask&&V.ask.kind==='turn'){
    var key=k.getAttribute('data-k'),t=+k.getAttribute('data-t');
    if(COARSE&&U.sel!==key){U.sel=key;U.selT=t;draw();return;}
    answer({a:'discard',t:t});
  }
}
function onInput(e){
  var id=e.target&&e.target.id;
  if(id==='pname'){U.name=e.target.value;try{localStorage.setItem('mj_name',U.name);}catch(x){}}
  else if(id==='roomcode'){U.roomInput=e.target.value.toUpperCase();}
  else if(id==='savecode'){U.codeInput=e.target.value.toUpperCase();}
}
function boot(){
  setInterval(function(){try{var l=cdLeft();if(l==null)return;var t=cdText();
    document.querySelectorAll('[data-cd]').forEach(function(e){var x=e.classList.contains('cdn')&&e.parentNode&&e.parentNode.classList.contains('note')?' '+t:t;if(e.textContent!==x)e.textContent=x;});
    document.querySelectorAll('[data-cd2]').forEach(function(e){e.textContent=Math.ceil(l/1000);});}catch(x){}},250);
  els.opps=document.getElementById('opps');els.mid=document.getElementById('mid');els.pond=document.getElementById('pond');
  els.dock=document.getElementById('dock');els.overlay=document.getElementById('overlay');els.speed=document.getElementById('btnSpeed');els.share=document.getElementById('btnShare');
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  try{U.name=localStorage.getItem('mj_name')||'';}catch(e){}
  try{U.pondHidden=localStorage.getItem('mj_pondHide')==='1';}catch(e){}
  var pm=/[?&#]pond=([A-Za-z0-9]+)/.exec((location.search||'')+(location.hash||''));
  if(pm){
    U.pondMode=true;U.roomInput=pm[1].toUpperCase();document.body.classList.add('pondmode');
    window.addEventListener('resize',function(){fitPond();});
    document.addEventListener('visibilitychange',function(){if(!document.hidden)keepAwake();});
    keepAwake();draw();joinRoom();return;
  }
  U.saved=readLocalSave();
  if(cloudOn())loadCloudSave(saveCode(),false);
  var m=/[?&#]room=([A-Za-z0-9]+)/.exec((location.search||'')+(location.hash||''));
  if(m)U.roomInput=m[1].toUpperCase();
  setInterval(function(){
    var pr=NET.peer;if(pr&&pr.disconnected&&!pr.destroyed&&(U.role==='host'||U.pondOnly)){try{pr.reconnect();}catch(e){}}
    if(U.role==='host'&&!S.running&&NET.members.length)sendLobby();
    if(U.role==='host'&&S.running&&Object.keys(S.asks).some(function(k){return S.players[k]&&S.players[k].remote&&Date.now()-S.asks[k].since>25000;}))render();
  },3000);
  render();
}
window.__mj={setProxy:setProxy,endDraw:endDraw,tileEl:tileEl,onHostConn:onHostConn,onClientData:onClientData,pondView:pondView,setAuto:setAuto,resumeGame:resumeGame,loadCloudSave:loadCloudSave,readLocalSave:readLocalSave,saveCode:saveCode,CLOUD:CLOUD,dropSave:dropSave,LV3:LV3,S:S,U:U,NET:NET,get V(){return V;},evalWin:evalWin,cnt:cnt,startGame:startGame,hostOpen:hostOpen,joinRoom:joinRoom,act:handleAct,answer:answer,leaveAll:leaveAll,render:render,tname:tname,CANCEL:CANCEL,PTS:PTS,nextHand:nextHand,takeover:takeover};
if(typeof document!=='undefined'&&document.getElementById)boot();
})();
</script>
