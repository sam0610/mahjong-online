<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港式麻雀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: flat dark panels. Opponents stack on top, your own river below, hand + actions docked at the bottom. Cyan marks whose turn it is, coral marks a win, call or last discard. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9; --line:#dde2ea; --line-2:#c5ccd8;
  --ink:#151a23; --muted:#5d6678; --accent:#0a7f9c; --accent-ink:#ffffff; --hot:#d9432d;
  --tile-top:#fffdf7; --tile-bot:#f0ecdf; --tile-side:#98a1b3;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --rw:clamp(17px,4.6vw,24px); --mw:clamp(18px,4.8vw,26px);
  --hw:clamp(21px,calc((100vw - 40px) / 15.4),46px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(900px 420px at 50% -10%,#ffffff 0,rgba(236,239,243,0) 70%);color:var(--ink);font:14px/1.5 var(--sans);margin:0;
  padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
button{font:inherit;color:inherit}
.app{max-width:1040px;margin:0 auto;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{margin:0 8px 0 0;font:900 20px/1 var(--sans);letter-spacing:.22em}
.top .sp{flex:1}
.btn{font:500 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 16px;height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.t:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.win{background:var(--hot);border-color:var(--hot);color:#fff;font:900 18px var(--sans);padding:0 22px}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;height:44px;min-width:64px;padding:0 14px;cursor:pointer;font:500 15px var(--sans)}
.chip.on{border-color:var(--accent);background:rgba(10,127,156,.1);color:var(--accent);font-weight:700}

/* 牌面設計:預設米白,另有粉彩石墨灰藍(牌底 #2b3340),用 data-tile 切換 */
:root{--f-ink:#1c1a17;--f-red:#b3261e;--f-grn:#1f7a4d;--f-blu:#1d4e89;--f-iv:#f7f1e1;--f-fl:#b8541c;--f-ol:none}
[data-tile="1"]{--tile-top:#323a49;--tile-bot:#2b3340;--tile-side:#1a2029;--tile-rim:#5d6a80;--f-ink:#ffffff;--f-red:#ff9aa8;--f-grn:#8ff0b0;--f-blu:#8ccbff;--f-iv:#2b3340;--f-fl:#ffd9a0;--f-ol:#fff}
[data-tile]:not([data-tile="0"]) .t{box-shadow:inset 0 0 0 max(1px,calc(var(--tw,30px)*.033)) var(--tile-rim),0 calc(var(--tw,30px)*.07) 0 var(--tile-side),0 calc(var(--tw,30px)*.12) calc(var(--tw,30px)*.1) rgba(30,40,60,.28)}
[data-tile]:not([data-tile="0"]) .t.taken{outline-color:#dfe8f5;background:linear-gradient(#5a6882,#4a566e)}
.tp-list{display:grid;gap:8px}
.tp-opt{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font:700 15px var(--sans);color:var(--ink);text-align:left;width:100%}
.tp-opt.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(10,127,156,.25)}
.tp-opt .tp-n{min-width:5.5em}
.tp-opt .tp-t{display:flex;gap:3px;--tw:26px;pointer-events:none}

/* 房號 */
.roomtag{font:700 14px var(--mono);letter-spacing:.12em;color:var(--accent);background:rgba(10,127,156,.1);border:1px solid rgba(10,127,156,.3);border-radius:8px;padding:5px 10px;margin-left:12px;white-space:nowrap}

/* tiles */
.t{width:var(--tw,30px);height:calc(var(--tw,30px)*1.36);display:inline-block;flex:none;position:relative;padding:calc(var(--tw,30px)*.05);margin:0;border:0;
  border-radius:calc(var(--tw,30px)*.12);background:linear-gradient(180deg,var(--tile-top),var(--tile-bot));
  box-shadow:inset 0 0 0 1px rgba(60,50,30,.1),0 calc(var(--tw,30px)*.07) 0 var(--tile-side),0 calc(var(--tw,30px)*.12) calc(var(--tw,30px)*.1) rgba(30,40,60,.28)}
.t svg{display:block;width:100%;height:100%}
.t text{font-family:var(--sans);font-weight:900}
.t.back{background:repeating-linear-gradient(135deg,#3f6f7e 0 2px,#376371 2px 5px);box-shadow:inset 0 0 0 1px #2c525f,0 calc(var(--tw,30px)*.07) 0 #1f3f4a,0 calc(var(--tw,30px)*.12) calc(var(--tw,30px)*.1) rgba(30,40,60,.3)}
.t.last{outline:2px solid var(--hot);outline-offset:1px}
.t.taken{outline:max(2px,calc(var(--tw,30px)*.1)) solid #23272f;outline-offset:-1px;background:linear-gradient(#e0f0f2,#cbe4e8)}
.t.taken::after{content:attr(data-tk);position:absolute;right:calc(var(--tw,30px)*-.09);top:calc(var(--tw,30px)*-.16);background:#23272f;color:#fff;font:700 max(8px,calc(var(--tw,30px)*.235))/1 var(--sans);padding:max(1px,calc(var(--tw,30px)*.044)) max(2px,calc(var(--tw,30px)*.088));border-radius:max(2px,calc(var(--tw,30px)*.088));white-space:nowrap;box-shadow:0 0 0 max(1px,calc(var(--tw,30px)*.035)) #fff;z-index:2}
.t.win{outline:2px solid var(--accent);outline-offset:2px}

/* seats */
.opps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:grid;gap:8px;min-width:0;position:relative}
.seat.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,127,156,.16)}
.sh{display:flex;align-items:center;gap:8px;min-width:0}
.wchip{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;font:700 14px/1 var(--sans);color:var(--accent);background:var(--surface-2)}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel{color:var(--muted);font-size:12px;white-space:nowrap}
.dl{font:700 11px/1 var(--sans);background:var(--hot);color:#fff;padding:3px 6px;border-radius:5px;white-space:nowrap;letter-spacing:.05em}
.sc{margin-left:auto;font:700 14px var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-end;min-width:0;min-height:calc(var(--mw)*1.36 + 6px)}
.backs{display:flex;gap:1px;--tw:13px;flex-wrap:wrap}
.meld,.fl,.reveal{display:inline-flex;gap:1px;--tw:var(--mw)}
.fl{--tw:calc(var(--rw)*.95)}
/* rack: hidden tiles, a divider, then open melds and flowers on one continuous strip */
.rack{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 0;min-width:0;padding:6px 8px 7px;border-radius:8px;background:linear-gradient(180deg,#2f3540,#262b34);border:1px solid #1c2027;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.rack .backs{--tw:15px;flex-wrap:nowrap;gap:6px}
.rack .grp{display:inline-flex;gap:1px}
.rack .t.back{background:repeating-linear-gradient(135deg,#9ed3dc 0 2px,#7fbfcb 2px 5px);box-shadow:inset 0 0 0 1px #5a9aa6,0 calc(var(--tw)*.07) 0 #3d7480,0 calc(var(--tw)*.12) calc(var(--tw)*.1) rgba(0,0,0,.3)}
.numbadge{margin-left:auto;font:900 12px/1 var(--sans);background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;white-space:nowrap}
.numbadge b{font:900 17px/1 var(--sans);color:var(--accent);margin-right:2px}
.numbadge+.sc{margin-left:8px}
.rack .backs+.sep,.rack .reveal+.sep,.rack .backs+.fl,.rack .reveal+.fl{margin-left:auto}
.rack .sep{flex:none;width:2px;align-self:stretch;margin:0 9px;background:rgba(255,255,255,.3);border-radius:1px}
.rack .meld{--tw:var(--mw)}
.rack .fl{--tw:var(--mw);gap:1px;margin-left:10px;align-self:flex-end}
.rack .reveal{--tw:var(--mw)}
.rack.me{padding:0 10px 8px;gap:4px 0;flex-wrap:wrap}
.rack.me .hand{padding-top:16px;flex:0 1 auto;min-height:0}
.rack.me .rm{display:flex;align-items:flex-end;min-width:0;padding-bottom:1px;margin-left:auto}
.rack.me .rm:empty{display:none}
.rack.me .meld,.rack.me .fl{--tw:calc(var(--hw)*.8)}
.reveal{flex-wrap:wrap}
.river{display:flex;flex-wrap:wrap;gap:4px 2px;--tw:var(--rw);min-height:calc(var(--rw)*1.36 + 6px);align-content:flex-start;padding-top:8px;border-top:1px solid var(--line)}
.call{position:absolute;right:12px;top:-15px;background:var(--hot);color:#fff;font:900 22px/1 var(--sans);padding:8px 14px;border-radius:8px;animation:pop 1.1s ease-out forwards;z-index:2;box-shadow:0 4px 14px rgba(30,40,60,.3)}
@keyframes pop{0%{transform:scale(.4);opacity:0}18%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}

.mid{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding:8px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);min-height:58px}
.mid .msg{color:var(--ink);font-weight:700;flex:1;min-width:150px}
.mid .lastd{display:inline-flex;align-items:center;gap:8px;--tw:28px}
.mid b{color:var(--ink);font:700 14px var(--mono);font-variant-numeric:tabular-nums}


/* new-game screen: two steps (settings, then how to play) */
.sheet.setup{gap:12px}
.shead{display:flex;align-items:center;gap:12px}
.shead .t{--tw:38px}
.shead h2{letter-spacing:.2em}
.shead p{font-size:13px}
.step{display:grid;gap:8px}
.step>h4{margin:0;display:flex;gap:8px;align-items:center;font:900 14px var(--sans)}
.step>h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:12px}
.step .card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:12px}
.step .lab{display:block;font:700 12px/1 var(--sans);letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.step .opts .chip{flex:1 1 0;white-space:nowrap;padding:0 6px}
.step .chip small{font-size:11px;font-weight:400;opacity:.75;margin-left:3px}
.step .btn.block{width:100%;min-height:48px;justify-content:center;font-weight:700}
.step .hr{height:1px;background:var(--line);border:0;margin:0}
.step .note{margin:6px 0 0}
.link{color:var(--accent);font:500 13px var(--sans);text-decoration:underline;background:none;border:0;padding:4px 0;cursor:pointer}
/* central discard pool */
.pond{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:grid;gap:8px;min-width:0}
.pond .plg{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px;color:var(--muted)}
.pond .lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pond .lg i{width:14px;height:4px;border-radius:2px;background:var(--c)}
.pond .pc{margin-left:auto;font:600 12px var(--mono)}
.pool{display:flex;flex-wrap:wrap;gap:6px 3px;--tw:calc(var(--rw)*1.12);min-height:calc(var(--rw)*1.12*1.36 + 10px);align-content:flex-start;padding-bottom:6px}
.pool .t{margin-bottom:5px}
.pool .t::after{content:'';position:absolute;left:10%;right:10%;bottom:-6px;height:3px;border-radius:2px;background:var(--c)}
.s0{--c:#0a7f9c}.s1{--c:#d9822b}.s2{--c:#7a56c9}.s3{--c:#3f9a5c}
.verlink{margin-left:10px;font-size:12px;color:var(--muted);text-decoration:underline;white-space:nowrap}
/* dock */
.dock{position:sticky;bottom:0;z-index:3;padding:14px 0 10px;background:linear-gradient(180deg,rgba(236,239,243,0),var(--bg) 22px)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:44px;margin-bottom:6px}
.mep{display:inline-flex;align-items:center;gap:6px;margin-right:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;white-space:nowrap}
.mep.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,127,156,.16)}
.mep .sc{margin-left:4px}
.note{color:var(--muted);font-size:13px}
.bt{display:inline-flex;gap:1px;--tw:18px}
.claimtile{display:inline-flex;--tw:30px;margin-right:4px}
.alert{flex:1 1 100%;display:flex;align-items:center;gap:10px;background:var(--hot);color:#fff;border-radius:10px;padding:8px 12px;font-weight:900;font-size:15px;line-height:1.3;box-shadow:0 4px 14px rgba(217,67,45,.35);animation:alertpulse 1.2s ease-in-out infinite}
.alert .claimtile{--tw:28px;margin:0}.alert small{display:block;font-weight:500;font-size:12px;opacity:.92}
.dmsg{display:none}
.cmerge{display:contents}
.claimrow{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.claimrow .sp{flex:1}
.btn.big{font:900 17px var(--sans);height:44px;padding:0 20px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn.big.o{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.passb{color:var(--muted);height:36px;padding:0 14px}
.btn.big.passb{height:44px;padding:0 22px;font:900 17px var(--sans);letter-spacing:.06em;background:var(--surface-2);color:var(--ink);border-color:var(--line-2);box-shadow:0 3px 0 rgba(0,0,0,.12)}
@keyframes alertpulse{50%{box-shadow:0 0 0 6px rgba(217,67,45,.18),0 4px 14px rgba(217,67,45,.35)}}
.hand{display:flex;align-items:flex-end;gap:2px;--tw:var(--hw);padding-top:14px;min-height:calc(var(--hw)*1.36 + 20px)}
.hand .t{cursor:pointer;transition:transform .1s}
.hand .t:hover{transform:translateY(-5px)}
.hand .t.sel{transform:translateY(-14px);outline:2px solid var(--accent);outline-offset:1px}
.hand.off .t{cursor:default}
.hand.off .t:hover{transform:none}
.hand .gap{width:calc(var(--hw)*.35);flex:none}

/* overlay */
/* 房主排位 + 擲骰揀莊 */
:root{--c0:#0a7f9c;--c1:#d9791a;--c2:#6a4bb0;--c3:#2c9a5b}
.sp-table{position:relative;aspect-ratio:1.3;max-width:420px;width:100%;margin:0 auto;border-radius:20px;background:#e6f0ee;box-shadow:inset 0 0 0 4px #cfe0dd}
.sp-mid{position:absolute;inset:36% 33%;border-radius:14px;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center;font:700 12px/1.3 var(--sans);color:var(--muted);text-align:center}
.sp-seat{position:absolute;width:32%;min-height:24%;border:2px dashed #9fbcbc;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center;align-content:center;gap:2px;padding:4px;font:700 13px var(--sans);text-align:center;cursor:default;touch-action:manipulation}
.sp-seat.on{border-style:solid;background:#fff}
.sp-seat.fixed{background:#f4f9f9}
.sp-seat .tag{font:500 11px var(--sans);color:var(--muted)}
.sp-seat .pn{display:flex;align-items:center;gap:5px;max-width:100%}
.sp-seat .pn i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.sp-seat .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-seat.pb{bottom:3%;left:34%}.sp-seat.pt{top:3%;left:34%}.sp-seat.pl{left:3%;top:38%}.sp-seat.pr{right:3%;top:38%}
.sp-edit .sp-seat.on:not(.fixed){cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.sp-edit .sp-seat:not(.fixed){border-color:#6aa3a8}
.sp-seat.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,40,43,.15)}
.sp-seat.over{border-color:var(--hot);border-style:solid;background:#fff7ea;box-shadow:0 0 0 4px rgba(217,67,45,.25)}
.sp-seat.dragging{opacity:.4}
.sp-ghost{position:fixed;z-index:60;pointer-events:none;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;font:700 15px var(--sans);box-shadow:0 10px 24px rgba(0,0,0,.25);transform:translate(-50%,-60%)}
.sp-ghost i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.dc-table{position:relative;aspect-ratio:1.25;width:100%;max-width:560px;margin:0 auto;border-radius:20px;background:#e6f0ee;box-shadow:inset 0 0 0 4px #cfe0dd}
.dc-p{position:absolute;display:grid;justify-items:center;gap:5px;width:34%}
.dc-p.pt{top:4%;left:33%}.dc-p.pb{bottom:4%;left:33%}.dc-p.pl{left:2%;top:34%}.dc-p.pr{right:2%;top:34%}
.dc-nm{display:flex;align-items:center;gap:5px;font:700 13px var(--sans);background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;max-width:100%;white-space:nowrap}
.dc-nm i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.dc-nm b{overflow:hidden;text-overflow:ellipsis}
.dc-d{display:flex;gap:5px;min-height:40px}
.die{width:38px;height:38px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px #c5d3d3,0 3px 0 #b5c6c6;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;gap:1px}
.die b{border-radius:50%;margin:1px}
.die b.p{background:#1c1a17}
.die.one b.p.m{background:var(--hot)}
.die.rolling{animation:dcshake .12s infinite}
.die.ph{opacity:.25}
@keyframes dcshake{0%{transform:rotate(-8deg) translateY(-2px)}50%{transform:rotate(8deg) translateY(2px)}100%{transform:rotate(-8deg) translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.die.rolling{animation:none;opacity:.6}}
.dc-sum{font:900 20px/1 var(--sans);min-height:20px}
.dc-wt{font:500 12px var(--sans);color:var(--muted)}
.dc-p.win .dc-nm{background:var(--hot);color:#fff;border-color:var(--hot)}
.dc-p.tie .dc-nm{background:#fff3d6;border-color:#f0b400}
.dc-p.out{opacity:.5}
.dc-wd{font:900 13px var(--sans);color:#fff;background:var(--hot);border-radius:6px;padding:1px 8px}
.kbsel{outline:3px solid #f0b400;outline-offset:3px;transform:scale(1.3);transform-origin:right center;z-index:5;position:relative;transition:transform .12s}
.kbsel.armed{transform:translateX(-28px) scale(1.3);box-shadow:0 0 0 6px rgba(240,180,0,.35)}
.kbh{display:block;color:var(--muted);font:500 12px var(--sans);margin-top:4px;text-align:center;white-space:nowrap}
.kbh kbd{font:700 11px/1 var(--mono);background:rgba(0,0,0,.1);border-radius:4px;padding:2px 5px;margin:0 2px}
.btn kbd,.note kbd{font:700 11px/1 var(--mono);background:rgba(0,0,0,.14);border-radius:4px;padding:2px 5px;margin-left:6px;color:inherit}
.btn.pri kbd,.btn.big kbd,.btn.win kbd{background:rgba(255,255,255,.28)}
.dcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px}
.dcp{display:grid;justify-items:center;gap:6px;background:var(--surface-2);border-radius:12px;padding:8px 4px}
.dcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;padding:2px 0}
.dcell.dout{opacity:.5}
.dcell.dwin .die{box-shadow:inset 0 0 0 2px var(--hot),0 3px 0 #b5c6c6}
.tpool .die{width:32px;height:32px;padding:4px;border-radius:8px}
.tpool .dc-sum{font-size:17px;min-height:0}
.ov{position:fixed;inset:0;background:rgba(22,26,34,.55);display:grid;place-items:center;z-index:20;overflow:auto;

<script>
(function(){

/* 電腦玩家名:每局由名單隨機抽(麻雀同音梗、地道花名),最多 8 字 */
var AI_POOL=['食糊黃','鄧俄林壯','戴對對','詐糊查','街市阿岑','放槍大王','麻雀龔','偷雞盧','牌神EASON','十三IU','三番市','四筒發達','大牌檔','拆牌專家','SMALL黃','一索得藍','青衣色','字魔是我','大山園','山缺一哥','食葫蘆','最愛碰碰車','洗白白','一世書家','營家之主','雀神','麻雀公爵','雞鴨湖','門前青草地','親一色','亂打一TONE','三番都唔夠','無PIE用','運財童子','九萬李','清一色雞糊','紅鍾','成地雀仔'];
var AI_NAMES=AI_POOL.slice(0,3);
var AI_CUSTOM=null;   /* 玩家自訂嘅電腦名單(冇設就用 AI_POOL) */
function shuf(a){a=a.slice();var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function aiNamesShuffle(){var c=(AI_CUSTOM||[]).filter(function(x){return typeof x==='string'&&x;}),rest=AI_POOL.filter(function(x){return c.indexOf(x)<0;});return shuf(c).concat(shuf(rest));}
var COARSE=(typeof matchMedia!=='undefined')&&matchMedia('(pointer: coarse)').matches;

function tname(t){return t<27?NUM[t%9]+SUIT[(t/9)|0]:t<31?WIND[t-27]:t<34?DRAG[t-31]:FLOW[t-34];}
function suitOf(t){return t<27?(t/9)|0:3;}
function isTerm(t){return t<27&&(t%9===0||t%9===8);}
function cnt(hand){var c=new Array(34).fill(0);for(var i=0;i<hand.length;i++){if(hand[i]<34)c[hand[i]]++;}return c;}
function removeOne(a,t){var i=a.indexOf(t);if(i>=0)a.splice(i,1);}
function removeN(a,t,n){for(var k=0;k<n;k++)removeOne(a,t);}
function fanLabel(ev){return ev.fan>=CAP?'滿貫':ev.fan+'番';}

/*@engine:end*/
/* ---------- tile faces ---------- */
var INK='var(--f-ink)',RED='var(--f-red)',GRN='var(--f-grn)',BLU='var(--f-blu)',IV='var(--f-iv)',FLW='var(--f-fl)';
var DP=[null,[[20,28]],[[20,15],[20,41]],[[11,12],[20,28],[29,44]],[[12,16],[28,16],[12,40],[28,40]],[[11,14],[29,14],[20,28],[11,42],[29,42]],[[12,12],[28,12],[12,28],[28,28],[12,44],[28,44]],[[10,10],[20,15],[30,20],[12,38],[28,38],[12,49],[28,49]],[[12,10],[28,10],[12,22],[28,22],[12,34],[28,34],[12,46],[28,46]],[[10,12],[20,12],[30,12],[10,28],[20,28],[30,28],[10,44],[20,44],[30,44]]];
var DC=[null,[GRN],[GRN,BLU],[BLU,RED,GRN],[BLU,GRN,GRN,BLU],[GRN,GRN,RED,GRN,GRN],[GRN,GRN,RED,RED,RED,RED],[GRN,GRN,GRN,RED,RED,RED,RED],[BLU,BLU,BLU,BLU,BLU,BLU,BLU,BLU],[GRN,GRN,GRN,RED,RED,RED,BLU,BLU,BLU]];
var DR=[0,12,8,7,7.5,6.5,6.5,5.2,5.4,5.4];
var BP=[null,null,[[20,15],[20,41]],[[20,14],[11,41],[29,41]],[[12,15],[28,15],[12,41],[28,41]],[[11,14],[29,14],[20,28],[11,42],[29,42]],[[12,11],[28,11],[12,28],[28,28],[12,45],[28,45]],[[20,11],[10,29],[20,29],[30,29],[10,46],[20,46],[30,46]],[[8,15],[16,15],[24,15],[32,15],[8,41],[16,41],[24,41],[32,41]],[[10,11],[20,11],[30,11],[10,28],[20,28],[30,28],[10,45],[20,45],[30,45]]];
function dot(x,y,r,c){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" stroke="var(--f-ol)" stroke-width=".5"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.62).toFixed(1)+'" fill="none" stroke="'+IV+'" stroke-width="1"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.26).toFixed(1)+'" fill="'+IV+'"/>';}
function stickR(x,y,h,c,rot){var w=5.4,r=rot?' transform="rotate('+rot+' '+x+' '+y+')"':'';return '<g'+r+'><rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="2" fill="'+c+'"/><path d="M'+(x-w/2)+' '+(y-h/6)+'h'+w+'M'+(x-w/2)+' '+(y+h/6)+'h'+w+'" stroke="'+IV+'" stroke-width=".9"/></g>';}
function stick(x,y,h,c){var w=5.4;return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="2" fill="'+c+'"/><path d="M'+(x-w/2)+' '+(y-h/6)+'h'+w+'M'+(x-w/2)+' '+(y+h/6)+'h'+w+'" stroke="'+IV+'" stroke-width=".9"/>';}
function txt(ch,y,size,fill){return '<text x="20" y="'+y+'" text-anchor="middle" font-size="'+size+'" fill="'+fill+'">'+ch+'</text>';}
function face(t){
  var g='',i,n;
  if(t<9){g=txt(NUM[t],26,22,INK)+txt('萬',49,22,RED);}
  else if(t<18){n=t-8;for(i=0;i<DP[n].length;i++)g+=dot(DP[n][i][0],DP[n][i][1],DR[n],DC[n][i]);}
  else if(t<27){n=t-17;
    if(n===1){g='<ellipse cx="20" cy="33" rx="9" ry="12" fill="'+GRN+'"/><circle cx="20" cy="17" r="6.5" fill="'+GRN+'"/><path d="M26 15l8 3-8 3z" fill="'+RED+'"/><circle cx="22" cy="15.5" r="1.4" fill="'+IV+'"/><path d="M14 30q6 8 12 0" stroke="'+RED+'" stroke-width="2" fill="none"/><path d="M17 44l-4 8M23 44l4 8" stroke="'+RED+'" stroke-width="2"/>';}
    else if(n===8){/* 八索:每半邊左右兩條直條,中間兩條斜條,上半 Λ、下半 V */
      g=stickR(7,16,21,GRN,0)+stickR(33,16,21,GRN,0)+stickR(7,40,21,GRN,0)+stickR(33,40,21,GRN,0)+
        stickR(15.5,16,18.5,GRN,29)+stickR(24.5,16,18.5,GRN,-29)+stickR(15.5,40,18.5,GRN,-29)+stickR(24.5,40,18.5,GRN,29);}
    else{var h=(n===6||n===7||n===9)?14:19;
      for(i=0;i<BP[n].length;i++){var col=GRN;
        if((n===5&&i===2)||(n===7&&i===0)||(n===9&&(i%3===1)))col=RED;
        g+=stick(BP[n][i][0],BP[n][i][1],h,col);}}}
  else if(t<31){g=txt(WIND[t-27],38,32,INK);}
  else if(t===31){g=txt('中',40,34,RED);}
  else if(t===32){g=txt('發',40,34,GRN);}
  else if(t===33){g='<rect x="9" y="10" width="22" height="36" rx="3" fill="none" stroke="'+BLU+'" stroke-width="2.4"/>';}
  else{var k=t-34;var col2=k<4?FLW:GRN;
    g='<circle cx="20" cy="26" r="16" fill="none" stroke="'+col2+'" stroke-width="1.2" opacity=".5"/>'+txt(FLOW[k],34,24,col2)+txt(String((k%4)+1),52,10,INK);}
  return '<svg viewBox="0 0 40 56" aria-hidden="true">'+g+'</svg>';
}
var FACE=[];for(var ft=0;ft<42;ft++)FACE.push(face(ft));
function tileEl(t,cls,tag){tag=tag||'span';return '<'+tag+' class="t '+(cls||'')+'" data-t="'+t+'">'+FACE[t]+'</'+tag+'>';}
var BACK='<span class="t back"></span>';
function takenMark(h,k){return k?h.replace('data-t=','data-tk="'+k+'" data-t='):h;}

/*@engine:begin eval*/
/* ---------- hand evaluation ---------- */
var ORPH=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function isThirteen(c){var tot=0,pair=0,i;for(i=0;i<34;i++)tot+=c[i];if(tot!==14)return false;var s=0;
  for(i=0;i<ORPH.length;i++){var v=c[ORPH[i]];if(v===0)return false;if(v===2)pair++;s+=v;}
  return pair===1&&s===14;}
function decomps(c,first){
  var out=[],sets=[];
  function rec(i,pair){
    while(i<34&&c[i]===0)i++;
    if(i>=34){out.push({pair:pair,sets:sets.slice()});return first;}
    if(c[i]>=3){c[i]-=3;sets.push({k:'pung',t:i});var s1=rec(i,pair);sets.pop();c[i]+=3;if(s1)return true;}
    if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;sets.push({k:'seq',t:i});var s2=rec(i,pair);sets.pop();c[i]++;c[i+1]++;c[i+2]++;if(s2)return true;}
    return false;
  }
  for(var t=0;t<34;t++){if(c[t]>=2){c[t]-=2;var st=rec(0,t);c[t]+=2;if(st)break;}}
  return out;
}
function scoreDecomp(d,p,ctx){
  var sets=p.melds.map(function(m){return {k:m.type==='chow'?'seq':'pung',t:m.tiles[0],kong:m.type==='kong',open:!m.concealed};})
    .concat(d.sets.map(function(s){return {k:s.k,t:s.t,kong:false,open:false};}));
  var pair=d.pair,tiles=[],i;
  sets.forEach(function(s){if(s.k==='seq')tiles.push(s.t,s.t+1,s.t+2);else tiles.push(s.t);});
  tiles.push(pair);
  var suits={},nsuit=0,honors=false,allTH=true;
  tiles.forEach(function(t){if(t>=27)honors=true;else if(!suits[suitOf(t)]){suits[suitOf(t)]=1;nsuit++;}if(!(t>=27||isTerm(t)))allTH=false;});
  var allPung=sets.every(function(s){return s.k==='pung';});
  var allSeq=sets.every(function(s){return s.k==='seq';});
  var rw=27+ctx.round,sw=27+p.wind;
  var dragons=sets.filter(function(s){return s.k==='pung'&&s.t>=31;});
  var winds=sets.filter(function(s){return s.k==='pung'&&s.t>=27&&s.t<31;});
  var limit=null;
  if(ctx.heaven)limit='天糊';
  else if(nsuit===0)limit='字一色';
  else if(allPung&&allTH&&!honors)limit='清么九';
  else if(winds.length===4)limit='大四喜';
  else if(sets.filter(function(s){return s.kong;}).length===4)limit='十八羅漢';
  else if(p.flowers.length===8)limit='八仙過海';
  if(limit)return {fan:CAP,items:[[limit,CAP]],limit:true};
  var items=[];
  if(ctx.self)items.push(['自摸',1]);
  if(sets.every(function(s){return !s.open;}))items.push(['門前清',1]);
  if(allPung&&allTH&&honors)items.push(['混么九',7]);
  else if(allPung)items.push(['對對糊',3]);
  if(nsuit===1&&!honors)items.push(['清一色',7]);
  else if(nsuit===1&&honors)items.push(['混一色',3]);
  if(allSeq&&pair<27&&true)items.push(['平糊',1]);
  if(dragons.length===3)items.push(['大三元',8]);
  else if(dragons.length===2&&pair>=31)items.push(['小三元',5]);
  else dragons.forEach(function(s){items.push(['三元牌 '+DRAG[s.t-31],1]);});
  if(winds.length===3&&pair>=27&&pair<31)items.push(['小四喜',6]);
  else winds.forEach(function(s){if(s.t===rw)items.push(['圈風 '+WIND[ctx.round],1]);if(s.t===sw)items.push(['門風 '+WIND[p.wind],1]);});
  if(ctx.self&&ctx.kongDraw)items.push(['槓上開花',1]);
  if(ctx.last)items.push([ctx.self?'海底撈月':'河底撈魚',1]);
  var f=p.flowers;
  if(f.length===0)items.push(['無花',1]);
  else{var m=0;f.forEach(function(t){if((t-34)%4===p.wind)m++;});
    if(m)items.push(['正花'+(m>1?' ×'+m:''),m]);
    var a=[34,35,36,37].every(function(t){return f.indexOf(t)>=0;}),b=[38,39,40,41].every(function(t){return f.indexOf(t)>=0;});
    if(a||b)items.push(['一台花',2]);}
  var tot=0;items.forEach(function(x){tot+=x[1];});
  return {fan:Math.min(CAP,tot),items:items,limit:false};
}
function evalWin(p,ctx){
  var c=cnt(p.hand),tot=0,i;for(i=0;i<34;i++)tot+=c[i];
  var ns=4-p.melds.length;
  if(tot!==ns*3+2)return null;
  var best=null;

  if(!hostSave)delete o.room;
  var str;try{str=JSON.stringify(o);}catch(e){return;}
  if(hostSave){roomPut(JSON.parse(str));return;}
  try{localStorage.setItem(SAVE_KEY,str);}catch(e){}
  cloudPut(JSON.parse(str));
}
function validSave(o){
  return !!(o&&o.v===1&&Array.isArray(o.players)&&o.players.length>=2&&o.players.length<=4&&Array.isArray(o.wall)&&(o.phase==='turn'||o.phase==='over'));
}
function readLocalSave(){try{var o=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return validSave(o)?o:null;}catch(e){return null;}}
function dropSave(skipCloud){
  U.saved=null;
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  if(cloudOn()&&!skipCloud){cloudPending=null;cloudCall('delete_game',{p_code:saveCode()}).catch(function(){});}
}
function loadCloudSave(code,manual){
  if(!cloudOn())return;
  cloudCall('load_game',{p_code:normCode(code)}).then(function(o){
    if(validSave(o)&&(!U.saved||o.ts>U.saved.ts)){U.saved=o;if(manual){try{localStorage.setItem(CODE_KEY,normCode(code));}catch(e){}try{localStorage.setItem(SAVE_KEY,JSON.stringify(o));}catch(e){}}U.notice='';render();}
    else if(manual){U.notice='搵唔到呢個存檔碼嘅牌局。';render();}
  },function(){if(manual){U.notice='連唔到伺服器,請稍後再試。';render();}});
}
function resumeGame(){
  var o=U.saved;if(!validSave(o))return;
  U.role='solo';U.notice='';
  S.token++;S.asks={};S.ready={};S.call=null;
  S.n=o.n;S.minFan=o.minFan;S.level=o.level;S.dealer=o.dealer;S.d0=o.d0||0;S.round=o.round;S.handNo=o.handNo;S.lian=o.lian;
  S.wall=o.wall;S.discN=o.discN;S.last=o.last;S.cur=o.cur;
  S.pond=Array.isArray(o.pond)?o.pond:(function(){var a=[];o.players.forEach(function(p,i){p.discards.forEach(function(){a.push(i);});});return a;})();
  S.players=o.players.map(function(p){return {id:p.id,name:p.name,human:p.human,remote:false,score:p.score,level:p.level,hand:p.hand,melds:p.melds,flowers:p.flowers,discards:p.discards,taken:p.taken||{},wind:p.wind,drawn:p.drawn};});
  S.running=true;U.screen='game';U.rules=false;U.modalHidden=false;U.saved=null;
  if(o.phase==='over'){
    S.over=true;S.result=o.result;S.msg='';
    nextHand();
  }else{S.over=false;S.result=null;runGame(o.turn||{});}
  render();

/*@engine:begin flow*/
/* ---------- game flow (host / single player) ---------- */
function callout(i,text){var id=++callId;S.call={i:i,text:text,id:id};render();setTimeout(function(){if(S.call&&S.call.id===id){S.call=null;render();}},1100);}
function buildWall(){
  var w=[],t,k;
  for(t=0;t<34;t++)for(k=0;k<4;k++)w.push(t);
  for(t=34;t<42;t++)w.push(t);
  for(var i=w.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=w[i];w[i]=w[j];w[j]=x;}
  return w;
}
function sortHand(p){p.hand.sort(function(a,b){return a-b;});}
function drawTile(p,fromBack){
  for(;;){
    if(S.wall.length<=0)return false;
    var t=fromBack?S.wall.pop():S.wall.shift();
    if(t>=34){p.flowers.push(t);S.msg=p.name+' 補花 '+tname(t);fromBack=true;continue;}
    p.hand.push(t);sortHand(p);p.drawn=t;return true;
  }
}
function replaceFlowers(p){
  for(;;){
    var idx=-1;for(var i=0;i<p.hand.length;i++)if(p.hand[i]>=34){idx=i;break;}
    if(idx<0)return;
    p.flowers.push(p.hand.splice(idx,1)[0]);
    p.hand.push(S.wall.pop());
  }
}
function kongOptions(p){
  if(S.wall.length<=0)return [];
  var c=cnt(p.hand),out=[];
  for(var t=0;t<34;t++){
    if(c[t]===4)out.push(t);
    else if(c[t]>=1&&p.melds.some(function(m){return m.type==='pung'&&m.tiles[0]===t;}))out.push(t);
  }
  return out;
}
function doKong(p,t){
  var c=cnt(p.hand);
  if(c[t]===4){removeN(p.hand,t,4);p.melds.push({type:'kong',tiles:[t,t,t,t],concealed:true});}
  else{removeOne(p.hand,t);var m=p.melds.filter(function(m){return m.type==='pung'&&m.tiles[0]===t;})[0];m.type='kong';m.tiles.push(t);}
  p.drawn=null;
}
function chowOptions(p,t){
  if(t>=27)return [];
  var c=cnt(p.hand),r=t%9,out=[];
  if(r>=2&&c[t-2]&&c[t-1])out.push([t-2,t-1]);
  if(r>=1&&r<=7&&c[t-1]&&c[t+1])out.push([t-1,t+1]);
  if(r<=6&&c[t+1]&&c[t+2])out.push([t+1,t+2]);
  return out;
}
function doClaim(s,d,t,kind,seq){
  var p=S.players[s],from=S.players[d];
  (from.taken=from.taken||{})[from.discards.length-1]=kind==='pung'?'碰':kind==='kong'?'槓':'上';
  if(kind==='pung'){removeN(p.hand,t,2);p.melds.push({type:'pung',tiles:[t,t,t],from:d});}
  else if(kind==='kong'){removeN(p.hand,t,3);p.melds.push({type:'kong',tiles:[t,t,t,t],from:d});}
  else{removeOne(p.hand,seq[0]);removeOne(p.hand,seq[1]);p.melds.push({type:'chow',tiles:[seq[0],seq[1],t].sort(function(a,b){return a-b;}),from:d});}
  p.drawn=null;S.last=null;
  var label=kind==='pung'?'碰':kind==='kong'?'槓':'上';
  S.msg=p.name+' '+label+' '+tname(t);
  callout(s,label);
}

async function resolveClaims(d,t){
  var n=S.n,P=S.players,order=[],k;
  for(k=1;k<n;k++)order.push((d+k)%n);
  var last=S.wall.length<=0,i,s,p,a;
  for(i=0;i<order.length;i++){
    s=order[i];p=P[s];
    var ev=evalWith(p,t,{self:false,round:S.round,last:last});
    if(!ev||ev.fan<S.minFan)continue;
    if(p.human){a=await ask(s,'claim',{tile:t,from:d,ev:ev});if(a.a==='win')return {type:'win',seat:s,ev:ev,tile:t};}
    else if(!winOK(p,ev))continue;   /* 食糊限制(只食大牌型):自摸同出銃一律,三個難度都一樣 */
    else return {type:'win',seat:s,ev:ev,tile:t};
  }
  var asked={};
  for(i=0;i<order.length;i++){
    s=order[i];p=P[s];
    var c=cnt(p.hand);
    if(c[t]<2)continue;
    var canKong=c[t]>=3&&S.wall.length>0;
    if(p.human){
      var chows=(i===0)?chowOptions(p,t):[];
      asked[s]=true;
      a=await ask(s,'claim',{tile:t,from:d,pung:true,kong:canKong,chows:chows});
      if(a.a==='pung'||a.a==='kong'){doClaim(s,d,t,a.a);return {type:a.a,seat:s};}
      if(a.a==='chow'){doClaim(s,d,t,'chow',a.seq);return {type:'chow',seat:s};}
    }else{
      var dec=aiPung(p,t,canKong);
      if(dec){await T(450);doClaim(s,d,t,dec);return {type:dec,seat:s};}
    }
  }
  s=order[0];p=P[s];
  var opts=chowOptions(p,t);
  if(opts.length){
    if(p.human){
      if(!asked[s]){a=await ask(s,'claim',{tile:t,from:d,chows:opts});if(a.a==='chow'){doClaim(s,d,t,'chow',a.seq);return {type:'chow',seat:s};}}
    }else{
      var seq=aiChow(p,t,opts);
      if(seq){await T(450);doClaim(s,d,t,'chow',seq);return {type:'chow',seat:s};}
    }
  }
  return {type:'none'};
}

function endWin(w,from,ev,self,tile){
  var P=S.players,base=PTS[ev.fan],deltas=P.map(function(){return 0;});
  if(!self){P[from].discards.pop();S.pond.pop();P[w].hand.push(tile);}
  sortHand(P[w]);
  if(self){var each=S.n===2?PTS[ev.fan]:PSELF[ev.fan];   /* 2 players: self-draw is paid in full like a discard win */P.forEach(function(p,i){if(i!==w){deltas[i]-=each;deltas[w]+=each;}});}
  else{deltas[from]-=base;deltas[w]+=base;}
  P.forEach(function(p,i){p.score+=deltas[i];p.drawn=null;});
  S.over=true;S.ready={};armNext();S.winTile=tile;S.last=null;S.result={type:'win',winner:w,from:from,self:self,ev:ev,deltas:deltas,tile:tile};
  S.msg=P[w].name+(self?' 自摸':' 食糊');
  callout(w,self?'自摸':'胡');
  snapshot('over');
  render();
}
function endDraw(){
  S.over=true;S.ready={};armNext();S.last=null;S.result={type:'draw'};S.msg='流局';
  snapshot('over');
  S.players.forEach(function(p){p.drawn=null;});
  render();
}

async function playHand(resume){
  var n=S.n,P=S.players,d=S.dealer,k;
  S.over=false;S.result=null;S.winTile=null;S.call=null;S.ready={};
  if(!resume){
    S.players.forEach(function(q){q.auto=false;});
    S.wall=buildWall();S.last=null;S.discN=0;
    S.msg='洗牌、起牌…';
    P.forEach(function(p,i){p.hand=[];p.melds=[];p.flowers=[];p.discards=[];p.taken={};p.drawn=null;p.wind=(i-d+n)%n;});S.pond=[];
    for(var r=0;r<13;r++)for(k=0;k<n;k++)P[(d+k)%n].hand.push(S.wall.shift());
    for(k=0;k<n;k++)replaceFlowers(P[(d+k)%n]);
    P.forEach(sortHand);
    S.cur=d;render();await T(700);
  }else{S.msg='繼續上次牌局';render();await T(400);}
  var mode=resume?'resume':'draw',kongDraw=false;
  for(;;){
    var p=P[S.cur];
    var heaven=false;
    if(mode==='resume'){kongDraw=!!resume.kongDraw;heaven=!!resume.heaven;mode=resume.claimed?'claimed':'resumed';}
    else if(mode==='draw'){if(!drawTile(p,false))return endDraw();kongDraw=false;heaven=(S.cur===d&&S.discN===0);}
    else if(mode==='kongdraw'){if(!drawTile(p,true))return endDraw();kongDraw=true;}
    render();
    var ev=null,kongs=[];
    if(mode!=='claimed'){
      ev=evalWin(p,{self:true,round:S.round,kongDraw:kongDraw,last:S.wall.length<=0,heaven:heaven});
      kongs=kongOptions(p);
    }
    var act;
    if(!p.human&&U.role==='host')snapshot('turn',{claimed:mode==='claimed',kongDraw:kongDraw,heaven:heaven});
    if(p.human){snapshot('turn',{claimed:mode==='claimed',kongDraw:kongDraw,heaven:heaven});act=await ask(S.cur,'turn',{ev:ev,kongs:kongs,claimed:mode==='claimed',kongDrawn:(mode!=='claimed'&&p.drawn!=null&&kongs.indexOf(p.drawn)>=0)?p.drawn:null});}
    else{S.msg=p.name+' 思考中…';render();await T(650);act=aiTurn(p,ev,kongs);}
    if(act.a==='win')return endWin(S.cur,null,ev,true,p.drawn);
    if(act.a==='kong'){
      doKong(p,act.t);S.msg=p.name+' 槓 '+tname(act.t);callout(S.cur,'槓');await T(650);
      mode='kongdraw';continue;
    }
    var t=act.t;
    removeOne(p.hand,t);p.drawn=null;p.discards.push(t);S.pond.push(S.cur);S.last={seat:S.cur,t:t};S.discN++;
    S.msg=p.name+' 打出 '+tname(t);render();
    await T(350);
    var res=await resolveClaims(S.cur,t);
    if(res.type==='win')return endWin(res.seat,S.cur,res.ev,false,res.tile);
    if(res.type==='none'){S.cur=(S.cur+1)%n;mode='draw';continue;}
    S.cur=res.seat;mode=res.type==='kong'?'kongdraw':'claimed';
    await T(300);
  }
}
function d6(){return 1+Math.floor(Math.random()*6);}
async function rollOne(s){
  var p=S.players[s],tok=S.token;
  if(p.human){
    var pr=ask(s,'roll',{}),id=S.asks[s]&&S.asks[s].id;
    setTimeout(function(){var cur=S.asks[s];if(cur&&cur.id===id&&S.token===tok)answerSeat(s,id,{a:'roll'});},25000);   /* 太耐冇撳:幫佢擲 */
    await pr;
  }else await T(700+Math.random()*1600);
  S.dice.vals[s]=[d6(),d6()];render();
}
async function rollDealer(){
  var n=S.n,P=S.players,cand=[],i;
  for(i=0;i<n;i++){cand.push(i);P[i].wind=i;}
  S.wall=[];S.pond=[];S.cur=0;S.over=false;S.result=null;S.last=null;S.call=null;S.discN=0;
  S.dice={vals:{},rolling:[],tie:[],win:-1};
  for(var guard=0;guard<20;guard++){
    cand.forEach(function(s){delete S.dice.vals[s];});
    S.dice.rolling=cand.slice();S.dice.tie=[];S.msg='擲骰決定邊個做莊';render();
    await Promise.all(cand.map(rollOne));
    S.dice.rolling=[];
    var sums=cand.map(function(s){return S.dice.vals[s][0]+S.dice.vals[s][1];}),mx=Math.max.apply(null,sums);
    var top=cand.filter(function(s,j){return sums[j]===mx;});
    if(top.length===1){S.dice.win=top[0];break;}
    if(guard===19){S.dice.win=top[Math.floor(Math.random()*top.length)];break;}
    S.dice.tie=top;S.msg='平手,打和嘅人再擲';render();await T(1900);cand=top;
  }
  S.dealer=S.d0=S.dice.win;
  P.forEach(function(p,j){p.wind=(j-S.dealer+n)%n;});
  S.msg=P[S.dealer].name+' 做莊(東)';S.dice.left=10;render();
  var tok=S.token;
  P.forEach(function(p,j){if(p.human)ask(j,'dok',{});});
  S.msg=P[S.dealer].name+' 做莊(東)';
  for(var left=10;left>0;left--){
    S.dice.left=left;render();
    if(!Object.keys(S.asks).length)break;
    await T(1000);
  }
  Object.keys(S.asks).forEach(function(k){var a=S.asks[k];if(a&&a.kind==='dok'){delete S.asks[k];a.res({a:'ok'});}});
  S.dice=null;render();
}
function runFirst(){rollDealer().then(function(){return playHand(false);}).catch(function(e){if(e!==CANCEL)console.error(e);});}
/* ---------- 房主排位 ---------- */
function guestList(){
  var a=NET.members.filter(function(m){return m.joined&&!m.pond;});
  return HOSTSEAT?a:a.slice(1);
}
function seatPlan(){   /* 每個座位坐邊個(座位 0 = 房主 → 以 null / 房主本人代表);客人冇揀嘅,順序補 */
  var n=U.cfg.n,gs=guestList(),plan=[],i;
  for(i=0;i<n;i++)plan.push(null);
  gs.forEach(function(g){var k=g.pref;if(k>=1&&k<n&&!plan[k])plan[k]=g;else g.pref=-1;});
  gs.forEach(function(g){if(g.pref>=1&&plan[g.pref]===g)return;for(var k=1;k<n;k++)if(!plan[k]){plan[k]=g;g.pref=k;return;}g.pref=-1;});
  if(!HOSTSEAT){var a=NET.members.filter(function(m){return m.joined&&!m.pond;});plan[0]=a[0]||null;}
  return plan;
}
function moveSeat(a,b){
  var n=U.cfg.n;if(S.running||a===b||a<1||b<1||a>=n||b>=n)return;
  var plan=seatPlan(),t=plan[a];plan[a]=plan[b];plan[b]=t;
  plan.forEach(function(g,k){if(g&&k>=1)g.pref=k;});
  sendLobby();render();
}
function shuffleSeats(){
  var n=U.cfg.n;if(S.running)return;
  var plan=seatPlan(),ks=[],i;
  for(i=1;i<n;i++)ks.push(i);
  for(i=ks.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=ks[i];ks[i]=ks[j];ks[j]=t;}
  var old=plan.slice();
  for(i=1;i<n;i++)if(old[i])old[i].pref=ks[i-1];
  /* 空位唔使理;冇人坐嘅座位自然係電腦 */
  sendLobby();render();
}
function runGame(resume){playHand(resume).catch(function(e){if(e!==CANCEL)console.error(e);});}

function startGame(){
  S.token++;S.asks={};S.ready={};
  var n=U.cfg.n,mem=U.role==='host'?NET.members:[];
  S.n=n;S.minFan=U.cfg.minFan;S.level=U.cfg.level;
  S.players=[];
  AI_NAMES=aiNamesShuffle();var used={},ai=0;
  function uniq(nm){var x=nm,k=2;while(used[x]){x=nm+k;k++;}used[x]=1;return x;}
  var plan=seatPlan();
  for(var i=0;i<n;i++){
    var m=i===0?null:plan[i];
    var human=i===0||!!m;
    var name=i===0?(U.role==='solo'?'你':uniq(myName())):(m?uniq(m.name):uniq(AI_NAMES[ai++]));
    S.players.push({id:i,name:name,human:human,remote:!!m,score:1000,level:S.level,hand:[],melds:[],flowers:[],discards:[],wind:0,drawn:null});
    if(m){m.seat=i;S.players[i].pid=m.pid||'';}
    if(i===0&&U.role==='host')S.players[0].pid=myPid();   /* 房主都要有 pid,先可以斷線後用房號返嚟 */
  }
  mem.forEach(function(m){if(plan.indexOf(m)<0)m.seat=-1;});
  S.dealer=0;S.d0=0;S.round=0;S.handNo=1;S.lian=0;S.over=false;S.running=true;
  if(U.role==='solo')dropSave(true);
  if(U.role==='host'&&U.code)rememberRoom(U.code);
  U.screen='game';U.rules=false;U.modalHidden=false;
  runFirst();render();
}
var NEXT_SEC=20;
function armNext(){
  clearTimeout(S.nextT);S.nextAt=0;   /* 唔再自動開下一局:等玩家自己撳確認 */
  var tok=S.token,hn=S.handNo;
  setTimeout(function(){if(S.running&&S.over&&!S.frozen&&S.token===tok&&S.handNo===hn){S.players.forEach(function(p){if(p.human&&p.proxy)S.ready[p.id]=1;});render();checkReady();}},3500);
}
function cdLeft(){
  if(!V||!V.over)return null;
  if(U.role==='client'||U.role==='pond'){return V.dl?Math.max(0,V.dl-Date.now()):null;}
  return S.nextAt?Math.max(0,S.nextAt-Date.now()):null;
}
function cdText(){var l=cdLeft();return l==null?'':Math.ceil(l/1000)+' 秒後自動開下一局';}
function nextHand(){
  var r=S.result;if(!S.over||!r)return;
  clearTimeout(S.nextT);S.nextAt=0;
  if(r.type==='draw'||r.winner===S.dealer){S.lian++;}
  else{S.lian=0;S.dealer=(S.dealer+1)%S.n;if(S.dealer===(S.d0||0))S.round=(S.round+1)%4;}
  S.handNo++;S.ready={};U.modalHidden=false;
  runGame();render();
}
function checkReady(){
  if(!S.over||S.frozen)return;
  var hs=S.players.filter(function(p){return p.human;});
  if(hs.every(function(p){return S.ready[p.id]||p.proxy;}))nextHand();
}

/* ---------- views & networking ---------- */
function pondList(){
  var idx=S.players.map(function(){return 0;}),out=[];
  (S.pond||[]).forEach(function(sd){var p=S.players[sd];if(p&&idx[sd]<p.discards.length){var ix=idx[sd]++;out.push({s:sd,t:p.discards[ix],k:p.taken&&p.taken[ix]||''});}});
  return out;
}
function buildView(seat){
  if(!S.running||!S.players.length)return null;
  var a=S.asks[seat];
  return {me:seat,n:S.n,dealer:S.dealer,round:S.round,handNo:S.handNo,lian:S.lian,live:Math.max(0,S.wall.length),cur:S.cur,over:S.over,msg:S.msg,
    call:S.call?{i:S.call.i,text:S.call.text}:null,last:S.last,pond:pondList(),minFan:S.minFan,
    players:S.players.map(function(p,i){return {name:p.name+(p.offline?'(離線'+(p.offLeft?' '+p.offLeft+' 秒':'')+')':''),score:p.score,wind:p.wind,human:p.human,melds:p.melds,flowers:p.flowers,discards:p.discards,taken:p.taken||{},n:p.hand.length,
      hand:(i===seat||S.over)?p.hand:(U.debug&&seat===0&&!p.human&&U.role!=='client')?p.hand.slice().sort(function(a,b){return a-b;}):null,drawn:i===seat?p.drawn:null};}),
    auto:!!S.players[seat].auto,proxy:!!S.players[seat].proxy,autoSh:S.players[seat].human?autoSh(S.players[seat]):99,
    ask:a?{id:a.id,kind:a.kind,opts:a.opts}:null,

/*@engine:begin onHostConn*/
function onHostConn(conn){
  var m={conn:conn,name:'玩家',seat:-1,joined:false,pond:false};
  /* 收到 hello 先決定係玩家定係牌河屏;玩家先檢查人數同有冇開咗局 */
  function admit(d){
    if(S.running&&d&&d.pid){
      var si=-1;
      S.players.forEach(function(p,i){if(p.pid&&p.pid===d.pid&&p.remote!==undefined&&(p.away||p.remote))si=i;});
      if(si>=0){
        var old=NET.members.filter(function(x){return x.seat===si;})[0];
        if(old){NET.members.splice(NET.members.indexOf(old),1);old.seat=-1;try{old.conn.close();}catch(e){}}
        var pl=S.players[si];
        pl.human=true;pl.remote=true;pl.away=false;pl.auto=false;pl.proxy=false;if(pl.baseName)pl.name=pl.baseName;
        m.seat=si;m.joined=true;m.pid=d.pid;m.name=pl.name;NET.members.push(m);
        safeSend(conn,{t:'view',v:buildView(si)});render();
        if(HOOKS.seated)HOOKS.seated(si);
        return true;
      }
    }
    if(S.running){safeSend(conn,{t:'full',msg:'遊戲已經開始,入唔到。'});setTimeout(function(){try{conn.close();}catch(e){}},300);return false;}
    if(NET.members.length>=U.cfg.n-HOSTSEAT){safeSend(conn,{t:'full',msg:'房已經夠人。'});setTimeout(function(){try{conn.close();}catch(e){}},300);return false;}
    if(m.pid){NET.members.filter(function(x){return x!==m&&x.pid&&x.pid===m.pid;}).forEach(function(x){NET.members.splice(NET.members.indexOf(x),1);x.seat=-1;try{x.conn.close();}catch(e){}});}   /* 同一個人重連:踢走舊連線 */
    NET.members.push(m);m.joined=true;
    m.name='玩家'+NET.members.length;
    return true;
  }
  conn.on('data',function(d){
    if(!d||typeof d.t!=='string')return;
    if(d.t==='hello'){
      if(d.role==='pond'){
        if(!m.pond&&!m.joined){m.pond=true;NET.ponds.push(m);}
        safeSend(conn,lobbyInfo());
        if(S.running)safeSend(conn,{t:'pond',v:pondView()});
        return;
      }
      if(!m.joined){m.pid=String(d.pid||'').slice(0,24);if(!admit(d))return;if(m.seat>=0)return;}
      m.name=String(d.name||m.name).slice(0,8);sendLobby();render();
    }
    else if(d.t==='seat'||d.t==='shuffle'){
      if(HOSTSEAT||S.running||!m.joined||m.pond)return;
      var own=NET.members.filter(function(x){return x.joined&&!x.pond;})[0];
      if(own!==m)return;   /* 淨係房主(第一個入嘅人)可以排位 */
      if(d.t==='seat')moveSeat(+d.a,+d.b);else shuffleSeats();
    }
    else if(d.t==='rename'){
      if(!m.joined||m.pond)return;
      var nm=String(d.name||'').trim().slice(0,8);if(!nm)return;
      var base=nm,k2=2;
      function taken(x){return S.players.some(function(p,i){return i!==m.seat&&p.name===x;})||NET.members.some(function(o){return o!==m&&o.name===x;});}
      while(taken(nm)){nm=base+k2;k2++;}
      m.name=nm;
      if(m.seat>=0&&S.players[m.seat]){S.players[m.seat].name=nm;if(S.players[m.seat].baseName)S.players[m.seat].baseName=nm;}
      else sendLobby();
      render();
    }
    else if(d.t==='ans'){if(m.seat>=0)answerSeat(m.seat,d.id,d.v);}
    else if(d.t==='auto'){if(m.seat>=0)setAuto(m.seat,!!d.on);}
    else if(d.t==='proxy'){if(m.seat>=0)setProxy(m.seat,!!d.on);}
    else if(d.t==='ready'){if(m.seat>=0&&S.over){S.ready[m.seat]=1;render();checkReady();}}
  });
  conn.on('close',function(){
    if(m.pond){var pi=NET.ponds.indexOf(m);if(pi>=0)NET.ponds.splice(pi,1);return;}
    var i=NET.members.indexOf(m);if(i<0)return;
    if(!S.running){NET.members.splice(i,1);sendLobby();render();if(HOOKS.closed)HOOKS.closed();}
    else{var seat=m.seat;m.seat=-1;NET.members.splice(i,1);if(seat>=0){if(!(HOOKS.grace&&HOOKS.grace(seat)))takeover(seat);checkReady();}if(HOOKS.closed)HOOKS.closed();}
  });
}

var DIAG=[];
function dlog(k,d){try{DIAG.push(new Date().toTimeString().slice(0,8)+' '+k+(d!==undefined?' '+(typeof d==='string'?d:JSON.stringify(d)):''));if(DIAG.length>120)DIAG.shift();}catch(e){}}
(function(){
  try{
    window.addEventListener('error',function(e){dlog('ERR',(e.message||'')+' @'+(e.lineno||'')+':'+(e.colno||''));});
    window.addEventListener('unhandledrejection',function(e){var r=e.reason;if(r&&String(r).indexOf('CANCEL')>=0)return;dlog('REJ',String((r&&r.message)||r).slice(0,160));});
    document.addEventListener('visibilitychange',function(){dlog(document.hidden?'HIDDEN':'VISIBLE');});
    if(window.PerformanceObserver){var po=new PerformanceObserver(function(l){l.getEntries().forEach(function(en){if(en.duration>200)dlog('LONGTASK',Math.round(en.duration)+'ms');});});po.observe({entryTypes:['longtask']});}
    var lt=Date.now();setInterval(function(){var n=Date.now();if(n-lt>3500&&!document.hidden)dlog('STALL',(n-lt)+'ms');lt=n;},1000);
    window.addEventListener('online',function(){dlog('ONLINE');});window.addEventListener('offline',function(){dlog('OFFLINE');});
  }catch(e){}
})();

function tone(f,t0,dur,type,vol){
  var ac=SFX.ac;if(!ac||ac.state!=='running')return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

}

function boot2(){
  setInterval(function(){try{var l=cdLeft();if(l==null)return;var t=cdText();
    document.querySelectorAll('[data-cd]').forEach(function(e){var x=e.classList.contains('cdn')&&e.parentNode&&e.parentNode.classList.contains('note')?' '+t:t;if(e.textContent!==x)e.textContent=x;});
    document.querySelectorAll('[data-cd2]').forEach(function(e){e.textContent=Math.ceil(l/1000);});}catch(x){}},250);
  els.opps=document.getElementById('opps');els.mid=document.getElementById('mid');els.pond=document.getElementById('pond');els.tbl=document.getElementById('tbl');
  els.dock=document.getElementById('dock');els.overlay=document.getElementById('overlay');els.share=document.getElementById('btnShare');
  /* 房主排位:拖放(Pointer Events,手指/滑鼠)+ 先撳後撳 */
  (function(){
    var drag=null;
    function editable(){return U.screen==='lobby'&&!!document.querySelector('#spT.sp-edit');}
    document.addEventListener('pointerdown',function(e){
      if(!editable())return;
      var el=e.target.closest('#spT .sp-seat.on');if(!el)return;
      var sv=+el.getAttribute('data-s');if(!(sv>=1))return;
      drag={s:sv,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,nm:(el.querySelector('b')||{}).textContent||'',c:getComputedStyle(el).getPropertyValue('--c')};
      try{el.setPointerCapture(e.pointerId);}catch(x){}
    });
    document.addEventListener('pointermove',function(e){
      if(!drag||e.pointerId!==drag.id)return;
      if(!drag.on){
        if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<6)return;
        drag.on=true;U.spSel=null;
        var g=document.createElement('div');g.className='sp-ghost';g.style.setProperty('--c',drag.c);g.innerHTML='<i></i>'+esc(drag.nm);
        document.body.appendChild(g);drag.g=g;
        var src=document.querySelector('#spT .sp-seat[data-s="'+drag.s+'"]');if(src)src.classList.add('dragging');
      }
      drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
      var t=document.elementFromPoint(e.clientX,e.clientY),st=t&&t.closest('#spT .sp-seat');
      [].forEach.call(document.querySelectorAll('#spT .sp-seat.over'),function(x){x.classList.remove('over');});
      if(st&&+st.getAttribute('data-s')>=1)st.classList.add('over');
    });
    function end(e,cancel){
      if(!drag||e.pointerId!==drag.id)return;
      var d=drag;drag=null;if(d.g)d.g.remove();
      if(!d.on)return;
      window.__spDragged=Date.now();
      var t=document.elementFromPoint(e.clientX,e.clientY),st=t&&t.closest('#spT .sp-seat');
      if(!cancel&&st&&+st.getAttribute('data-s')>=1)seatMove(d.s,+st.getAttribute('data-s'));
      draw();
    }
    document.addEventListener('pointerup',function(e){end(e,false);});
    document.addEventListener('pointercancel',function(e){end(e,true);});
    document.addEventListener('click',function(e){
      if(Date.now()-(window.__spDragged||0)<350)return;
      var el=e.target.closest('#spT.sp-edit .sp-seat');if(!el)return;
      var sv=+el.getAttribute('data-s');if(!(sv>=1))return;
      if(U.spSel==null){if(el.classList.contains('on')){U.spSel=sv;draw();}}
      else if(U.spSel===sv){U.spSel=null;draw();}
      else{var a=U.spSel;U.spSel=null;seatMove(a,sv);draw();}
    });
  })();
  /* 鍵盤打牌:← → 揀牌、Enter/↓ 打出、H 胡、G 槓、P 碰、C 上、Space/Esc 過 */
  var kbHandled=false;
  document.addEventListener('keyup',function(e){if(kbHandled&&(e.key===' '||e.key==='Enter')){e.preventDefault();kbHandled=false;}});
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
    var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
    if(!V||U.pondMode)return;
    var k=e.key,K=k.length===1?k.toUpperCase():k,a=V.ask,go=(K==='Enter'||K===' ');
    function done(){e.preventDefault();kbHandled=true;}
    var ovHtml=els.overlay&&els.overlay.innerHTML.trim();
    if(ovHtml){
      var nb=els.overlay.querySelector('[data-act="next"]');
      if(nb&&(K==='Enter'||K==='N'||K===' ')){done();handleAct('next',nb);}
      return;
    }
    if(V.over&&U.modalHidden&&(K==='Enter'||K==='N')){var nb2=els.mid&&els.mid.querySelector('[data-act="next"]');if(nb2){done();handleAct('next',nb2);return;}}
    var kqNow=a&&a.kind==='turn'&&a.opts&&a.opts.kongDrawn!=null&&U.kqDismiss!==a.id;
    if((K==='N'&&!kqNow)||K==='M'){
      var ab=els.dock.querySelector('[data-act="'+(K==='N'?'auto':'proxy')+'"]');
      if(ab){done();handleAct(ab.getAttribute('data-act'),ab);}
      return;
    }
    if(!a)return;
    var o=a.opts||{};
    if(a.kind==='roll'){if(go){done();answer({a:'roll'});}return;}
    if(a.kind==='dok'){if(go){done();answer({a:'ok'});}return;}
    if(a.kind==='claim'){
      var cbs=[].slice.call(els.dock.querySelectorAll('.claimrow .btn')),act=U.cq&&U.cq.id===a.id;
      if(K==='C'){done();U.cq={id:a.id,idx:0};draw();}
      else if(act&&K==='ArrowDown'){done();U.cq.idx=(U.cq.idx+1)%cbs.length;U.cq.armed=false;draw();}
      else if(act&&K==='ArrowLeft'){   /* 第一下 ← :揀中嗰項向左移出(待確認);再按 ← :確認 */
        var cbl=cbs[U.cq.idx];
        if(!U.cq.armed){done();U.cq.armed=true;draw();}
        else if(cbl){done();U.cq=null;handleAct(cbl.getAttribute('data-act'),cbl);}
      }
      else if(act&&K==='ArrowUp'){done();U.cq.idx=(U.cq.idx-1+cbs.length)%cbs.length;U.cq.armed=false;draw();}
      else if(act&&go){var cbt=cbs[U.cq.idx];if(cbt){done();U.cq=null;handleAct(cbt.getAttribute('data-act'),cbt);}}
      else if(K==='ArrowRight'){done();}   /* 食碰槓上:→ 冇反應 */
      else if(go||K==='Escape'){done();U.cq=null;answer({a:'pass'});}
      return;
    }
    if(a.kind!=='turn')return;
    var kq=o.kongDrawn!=null&&U.kqDismiss!==a.id;
    if(K==='H'&&o.ev&&o.ev.fan>=V.minFan){done();answer({a:'win'});return;}
    if(K==='G'){
      var kt=null;
      if(kq)kt=o.kongDrawn;
      else if(o.kongs&&o.kongs.length){kt=U.selT!=null&&o.kongs.indexOf(U.selT)>=0?U.selT:o.kongs[0];}
      if(kt!=null){done();answer({a:'kong',t:kt});}
      return;
    }
    if(kq&&(K==='N'||K==='Escape')){done();handleAct('nokong',null);return;}
    var tiles=[].slice.call(els.dock.querySelectorAll('[data-k]'));if(!tiles.length)return;
    var cur=-1;tiles.forEach(function(x,i){if(x.getAttribute('data-k')===U.sel)cur=i;});
    function pick(i){i=Math.max(0,Math.min(tiles.length-1,i));U.tarm=false;U.sel=tiles[i].getAttribute('data-k');U.selT=+tiles[i].getAttribute('data-t');done();draw();}
    /* 第一下 ← 揀最左第一隻,第一下 → 揀最右第一隻;之後 ← → 逐隻移 */
    if(K==='ArrowLeft'||K==='A'){pick(cur<0?0:cur-1);}
    else if(K==='ArrowRight'||K==='D'){pick(cur<0?tiles.length-1:cur+1);}
    else if(K==='ArrowUp'&&cur>=0){   /* 第一下 ↑ :揀中嗰隻向上移出;再按 ↑ :打出 */
      if(!U.tarm){done();U.tarm=true;draw();}
      else{done();U.tarm=false;answer({a:'discard',t:+tiles[cur].getAttribute('data-t')});}
    }
  });
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&U.joinGate&&e.target&&e.target.id==='gname'){e.preventDefault();gateGo();}});
  document.addEventListener('click',onClick);
  window.addEventListener('resize',function(){try{fitSide();}catch(e){}});
  document.addEventListener('input',onInput);
  try{U.name=localStorage.getItem('mj_name')||'';}catch(e){}
  try{if(localStorage.getItem('mj_ainames'))AI_CUSTOM=aiList();}catch(e){}
  fetchAiNames();
  try{U.pondHidden=localStorage.getItem('mj_pondHide')==='1';}catch(e){}
  try{setTileTheme(localStorage.getItem('mj_tile'));}catch(e){}
  var pm=null;   /* 牌河屏功能已移除 */
  if(pm){
    U.pondMode=true;U.roomInput=pm[1].toUpperCase();document.body.classList.add('pondmode');
    window.addEventListener('resize',function(){fitPond();});
    document.addEventListener('visibilitychange',function(){if(!document.hidden)keepAwake();});
    keepAwake();draw();joinRoom();return;
  }
  var m=/[?&#]room=([A-Za-z0-9]+)/.exec((location.search||'')+(location.hash||''));
  if(m){U.roomInput=m[1].toUpperCase();if(netOK()){U.rejoin='';if(!(U.name||'').trim()){U.joinGate=true;}else joinRoom();}}   /* 分享連結:直接入房,唔經主頁 */
  setInterval(function(){
    var pr=NET.peer;if(pr&&pr.disconnected&&!pr.destroyed&&(U.role==='host'||U.pondOnly)){try{pr.reconnect();}catch(e){}}
    if(U.role==='host'&&!S.running&&NET.members.length)sendLobby();
    if(U.role==='host'&&S.running&&Object.keys(S.asks).some(function(k){return S.players[k]&&S.players[k].remote&&Date.now()-S.asks[k].since>25000;}))render();
  },3000);
  render();
}

<script>
(function(){
  /* 結算分數由 0 數到實數 */
  function run(el){
    if(el.getAttribute('data-run'))return;el.setAttribute('data-run','1');
    var to=+el.getAttribute('data-to')||0,t0=performance.now(),dur=900;
    function step(t){var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(step);}
    el.textContent='0';requestAnimationFrame(step);
  }
  var ov=document.getElementById('overlay');
  if(ov&&window.MutationObserver)new MutationObserver(function(){
    ov.querySelectorAll('.cu:not([data-run])').forEach(run);
  }).observe(ov,{childList:true,subtree:true});
})();
</script>
